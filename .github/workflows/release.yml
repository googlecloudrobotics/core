name: Create release

on:
  schedule:
    - cron: "0 23 * * *" # Once a day at 11pm UTC.
  # Manual runs through Actions tab in the UI
  workflow_dispatch:
    inputs:
      commit:
        description: >-
          Optional commit SHA to release. If omitted, the latest green commit
          from postsubmit.yml on the main branch will be read from GCS.
        required: false
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  pull-requests: read

# Cancel previous runs if a new one is started.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  create_release:
    runs-on: ubuntu-26.04
    steps:
      # Check out repo at specified commit, or latest green postsubmit commit on the main branch.
      # The SHA is written by integration_test.sh to a public GCS object.
      - name: Get latest passing commit
        id: latest-green
        run: |
          set -euo pipefail
          sha="${{ inputs.commit }}"
          if [[ -z "${sha}" ]]; then
            sha=$(curl --fail-with-body -sS --retry 5 --retry-all-errors \
              "https://storage.googleapis.com/robco-ci-binary-builds/latest-sha")
            sha=$(tr -d '[:space:]' <<< "$sha")
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid latest green SHA: '${sha}'"
            exit 1
          fi
          echo "latest_green=$sha" >> $GITHUB_OUTPUT
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          ref: ${{ steps.latest-green.outputs.latest_green }}
      - name: Auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # tag=v3.0.0
        with:
          create_credentials_file: true # also sets GOOGLE_APPLICATION_CREDENTIALS
          service_account: "github-automation-bot@gha-crc-prod.iam.gserviceaccount.com"
          workload_identity_provider: "projects/695270090783/locations/global/workloadIdentityPools/github-automation/providers/crc-prod"
      - name: "Set up gcloud"
        uses: "google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db" # tag=v3.0.1
        with:
          skip_install: true

      - name: Deploy Navtest on Cloud Build
        run: |
          gcloud builds submit \
            --project robco-navtest \
            --config .github/ci/deploy_navtest_cloudbuild.yaml

      # Now we are ready to create the release.
      - name: Run release_binary.sh
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL_SHA: ${{ steps.latest-green.outputs.latest_green }}
        run: ./.github/ci/release_binary.sh
