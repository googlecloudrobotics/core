# Used to generate the app-ingress-generated.yaml file.
# After making changes, regenerate with
#
# sys-cluster/ingress-istio/files/update_istio_yaml.sh
#
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  # The "default" profile includes the ingress gateway.
  profile: default

  values:
    global:
      logging:
        level: all:warn
      # Override the default namespace (istio-system) because we will wrap this YAML in a
      # ChartAssignment, and the controller will install to the default namespace.
      istioNamespace: default

  meshConfig:
    # from default
    defaultConfig:
      proxyMetadata: {}
    enablePrometheusMerge: true

    # Set this to "/dev/stdout" to enable access logging.
    accessLogFile: ""
    accessLogFormat: |
      {"authority": "%REQ(:AUTHORITY)%", "start_time": "%START_TIME%", "bytes_received": "%BYTES_RECEIVED%", "bytes_sent": "%BYTES_SENT%", "downstream_local_address": "%DOWNSTREAM_LOCAL_ADDRESS%", "downstream_remote_address": "%DOWNSTREAM_REMOTE_ADDRESS%", "duration": "%DURATION%", "istio_policy_status": "%DYNAMIC_METADATA(istio.mixer:status)%", "method": "%REQ(:METHOD)%", "path": "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%", "protocol": "%PROTOCOL%", "request_id": "%REQ(X-REQUEST-ID)%", "requested_server_name": "%REQUESTED_SERVER_NAME%", "response_code": "%RESPONSE_CODE%", "response_flags": "%RESPONSE_FLAGS%", "route_name": "%ROUTE_NAME%", "start_time": "%START_TIME%", "upstream_cluster": "%UPSTREAM_CLUSTER%", "upstream_host": "%UPSTREAM_HOST%", "upstream_local_address": "%UPSTREAM_LOCAL_ADDRESS%", "upstream_service_time": "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%", "upstream_transport_failure_reason": "%UPSTREAM_TRANSPORT_FAILURE_REASON%", "user_agent": "%REQ(USER-AGENT)%", "x_forwarded_for": "%REQ(X-FORWARDED-FOR)%", "x_icon_instance_name": "%REQ(x-icon-instance-name)%", "x_resource_instance_name": "%REQ(x-resource-instance-name)%"}

    extensionProviders:
      # Token Vendor: Robot Verification (x-crc-tv-robots: "true")
      - name: "auth-provider-tv-robots-true"
        envoyExtAuthzHttp:
          service: "token-vendor.default.svc.cluster.local"
          port: 8080
          pathPrefix: "/apis/core.token-vendor/v1/token.verify"
          includeAdditionalHeadersInCheck:
            x-crc-tv-robots: "true"
          includeRequestHeadersInCheck: ["authorization"]
          headersToUpstreamOnAllow: ["x-authenticated-robot"]

      # Token Vendor: Human Verification (x-crc-tv-robots: "false")
      - name: "auth-provider-tv-robots-false"
        envoyExtAuthzHttp:
          service: "token-vendor.default.svc.cluster.local"
          port: 8080
          pathPrefix: "/apis/core.token-vendor/v1/token.verify"
          includeAdditionalHeadersInCheck:
            x-crc-tv-robots: "false"
          includeRequestHeadersInCheck: ["authorization"]
          headersToUpstreamOnAllow: ["x-authenticated-user"]

      # Control Plane SA Token Sync Webhook (cr-syncer)
      - name: "auth-provider-cr-syncer"
        envoyExtAuthzHttp:
          service: "cr-syncer-auth-webhook.default.svc.cluster.local"
          port: 80
          pathPrefix: "/auth"
          includeRequestHeadersInCheck: ["authorization", "x-envoy-original-path", "x-original-url", ":authority", "x-forwarded-host"]
          headersToUpstreamOnAllow: ["authorization"]

      # OAuth Proxy (Mandatory in open-source core CRC)
      - name: "auth-provider-oauth"
        envoyExtAuthzHttp:
          service: "oauth-proxy.default.svc.cluster.local"
          port: 8080
          pathPrefix: "/oauth2/auth"
          includeRequestHeadersInCheck: ["authorization", "cookie"]

  components:
    base:
      enabled: true
    cni:
      enabled: false
    pilot:
      enabled: true
    ingressGateways:
      - name: istio-ingressgateway
        enabled: false
