{{- if .Values.enable_cloud_robot_victoriametrics }}
# This includes all resources expanded from the victoria-metrics-cluster
# chart using the values in ../victoriametrics-cloud.values.yaml.
# Some pseudo-variables that were inserted there are replaced with
# actual runtime values.
# NOTE: order is important - domain and project might be part of
# other values and need to be replaced last, mirroring Prometheus's
# prometheus-operator.yaml convention.
{{- $data := .Files.Get "files/victoriametrics-chart.cloud.yaml" -}}
{{- $data = $data | replace "${LIMITS_MEMORY}" .Values.limits.memory | replace "${LIMITS_CPU}" .Values.limits.cpu | replace "${REQUESTS_STORAGE}" .Values.requests.storage | replace "${RETENTION_TIME}" .Values.retention.time | replace "${VMINSERT_PORT}" (toString .Values.vminsert_port) | replace "${VMSELECT_PORT}" (toString .Values.vmselect_port) | replace "HELM-NAMESPACE" .Release.Namespace -}}
{{ $data }}
{{- end }}
