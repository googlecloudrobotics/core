{{- /* Backend: vmagent-central when enabled (default), otherwise vminsert-vmc. */ -}}
{{- $central := .Values.vmagentCentral | default dict -}}
{{- $target := dict "service" "vminsert-vmc" "port" (dig "spec" "vminsert" "port" 8480 (.Values.vmcluster | default dict)) "pathPrefix" "/insert/0/prometheus/" -}}
{{- if or (not (hasKey $central "enabled")) $central.enabled -}}
  {{- $target = dict "service" "vmagent-central" "port" ($central.port | default 8429) "pathPrefix" "/victoriametrics/cloud/vmagent-central/" -}}
{{- end -}}
# Robot vmagent (vmagent-vmr) remote-write path. Forwards to vmagent-central, or
# to vminsert-vmc when vmagentCentral.enabled is false. The public path is kept
# for compatibility with existing robot configurations.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoriametrics-cloudmetrics-write
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  hostnames:
  - {{ .Values.domain }}
  parentRefs:
  - name: crc-gateway
    namespace: default
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /victoriametrics-robotmetrics-write/insert/0/prometheus/
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: {{ $target.pathPrefix }}
    backendRefs:
    - name: {{ $target.service }}
      port: {{ $target.port }}
  - matches:
    - path:
        type: PathPrefix
        value: /victoriametrics-robotmetrics-write/
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: {{ $target.pathPrefix }}
    backendRefs:
    - name: {{ $target.service }}
      port: {{ $target.port }}
  - matches:
    - path:
        type: Exact
        value: /victoriametrics-robotmetrics-write
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: {{ $target.pathPrefix }}
    backendRefs:
    - name: {{ $target.service }}
      port: {{ $target.port }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: victoriametrics-cloudmetrics-write-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: victoriametrics-cloudmetrics-write
  extAuth:
    contextExtensions:
      - name: robot
        value: "true"
    headersToExtAuth:
      {{- toYaml .Values.authProxy.authHeaders | nindent 6 }}
    failOpen: false
    grpc:
      backendRefs:
      - name: token-vendor
        namespace: app-token-vendor
        port: 9091
