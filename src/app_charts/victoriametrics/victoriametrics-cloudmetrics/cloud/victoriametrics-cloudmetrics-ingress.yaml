{{- $vmselectPort := 8481 -}}
{{- $vmagentPort := 8429 -}}
{{- $vmalertPort := 8080 -}}
{{- if .Values.vmcluster -}}
  {{- if .Values.vmcluster.spec -}}
    {{- if .Values.vmcluster.spec.vmselect -}}
      {{- $vmselectPort = .Values.vmcluster.spec.vmselect.port | default 8481 -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if .Values.vmagent -}}
  {{- if .Values.vmagent.spec -}}
    {{- $vmagentPort = .Values.vmagent.spec.port | default 8429 -}}
  {{- end -}}
{{- end -}}
{{- /* vmagent-central settings; keep in sync with victoriametrics-cloudmetrics-operator.yaml. */ -}}
{{- $central := .Values.vmagentCentral | default dict -}}
{{- $centralEnabled := or (not (hasKey $central "enabled")) $central.enabled -}}
{{- $centralPort := toString ($central.port | default 8429) -}}
{{- $centralPathPrefix := "/victoriametrics/cloud/vmagent-central" -}}
{{- if .Values.vmalert -}}
  {{- if .Values.vmalert.spec -}}
    {{- $vmalertPort = .Values.vmalert.spec.port | default 8080 -}}
  {{- end -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: victoriametrics-cloudmetrics
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "{{ tpl .Values.victoriametrics_cloudmetrics_ingress_auth_url . }}"
    nginx.ingress.kubernetes.io/auth-signin: "{{ tpl .Values.victoriametrics_cloudmetrics_ingress_auth_signin . }}"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/configuration-snippet: |
      error_page 403 = {{ tpl .Values.victoriametrics_cloudmetrics_ingress_error_page_403 . }};
      rewrite ^/victoriametrics/cloud/?$ /victoriametrics/cloud/select/0/prometheus/vmui redirect;
      # Legacy robotmetrics URLs (robot metrics now live in this vmcluster).
      # Keep in sync with the redirects in victoriametrics-cloudmetrics-read-http-route.yaml.
      {{- if $centralEnabled }}
      rewrite ^/victoriametrics/robots/vmagent(.*)$ {{ $centralPathPrefix }}$1 redirect;
      {{- end }}
      rewrite ^/victoriametrics/robots/(select|vmalert)(.*)$ /victoriametrics/cloud/$1$2 redirect;
      rewrite ^/victoriametrics/robots(/.*)?$ /victoriametrics/cloud/select/0/prometheus/vmui/ redirect;
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.domain }}
    http:
      paths:
      # Main VMUI and Prometheus Query API
      - path: /victoriametrics/cloud
        pathType: Prefix
        backend:
          service:
            name: vmselect-vmc
            port:
              number: {{ $vmselectPort }}
      # Alerts Dashboard
      - path: /victoriametrics/cloud/vmalert
        pathType: Prefix
        backend:
          service:
            name: vmalert-vmc
            port:
              number: {{ $vmalertPort }}
      # Scraper Targets and Service Discovery Dashboard
      - path: /victoriametrics/cloud/vmagent
        pathType: Prefix
        backend:
          service:
            name: vmagent-vmc
            port:
              number: {{ $vmagentPort }}
      {{- if $centralEnabled }}
      # Central aggregation vmagent status / stream aggregation UI
      - path: {{ $centralPathPrefix }}
        pathType: Prefix
        backend:
          service:
            name: vmagent-central
            port:
              number: {{ $centralPort }}
      {{- end }}
      # Legacy robotmetrics URLs: redirected by the rewrites above.
      - path: /victoriametrics/robots
        pathType: Prefix
        backend:
          service:
            name: vmselect-vmc
            port:
              number: {{ $vmselectPort }}
