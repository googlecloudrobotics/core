{{- $vmselectPort := 8481 -}}
{{- $vmagentPort := 8429 -}}
{{- $vmalertPort := 8080 -}}
{{- if .Values.vmcluster }}
  {{- if .Values.vmcluster.spec }}
    {{- if .Values.vmcluster.spec.vmselect }}
      {{- if .Values.vmcluster.spec.vmselect.port }}
        {{- $vmselectPort = .Values.vmcluster.spec.vmselect.port -}}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if .Values.vmagent }}
  {{- if .Values.vmagent.spec }}
    {{- if .Values.vmagent.spec.port }}
      {{- $vmagentPort = .Values.vmagent.spec.port -}}
    {{- end }}
  {{- end }}
{{- end }}
{{- /* vmagent-central settings; keep in sync with victoriametrics-cloudmetrics-operator.yaml. */ -}}
{{- $central := .Values.vmagentCentral | default dict -}}
{{- $centralEnabled := or (not (hasKey $central "enabled")) $central.enabled -}}
{{- $centralPort := toString ($central.port | default 8429) -}}
{{- $centralPathPrefix := "/victoriametrics/cloud/vmagent-central" -}}
{{- if .Values.vmalert }}
  {{- if .Values.vmalert.spec }}
    {{- if .Values.vmalert.spec.port }}
      {{- $vmalertPort = .Values.vmalert.spec.port -}}
    {{- end }}
  {{- end }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoriametrics-cloudmetrics
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  hostnames:
  - {{ .Values.domain }}
  parentRefs:
  - name: crc-gateway
    namespace: default
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /victoriametrics/cloud/vmalert
    backendRefs:
    - name: vmalert-vmc
      port: {{ $vmalertPort }}
  - matches:
    - path:
        type: PathPrefix
        value: /victoriametrics/cloud/vmagent
    backendRefs:
    - name: vmagent-vmc
      port: {{ $vmagentPort }}
  - matches:
    - path:
        type: PathPrefix
        value: /victoriametrics/cloud
    backendRefs:
    - name: vmselect-vmc
      port: {{ $vmselectPort }}
  {{- if $centralEnabled }}
  - matches:
    - path:
        type: PathPrefix
        value: {{ $centralPathPrefix }}
    backendRefs:
    - name: vmagent-central
      port: {{ $centralPort }}
  # Legacy robotmetrics URLs (robot metrics now live in this vmcluster).
  # Keep in sync with the rewrites in victoriametrics-cloudmetrics-ingress.yaml.
  - matches:
    - path:
        type: PathPrefix
        value: /victoriametrics/robots/vmagent
    filters:
    - type: RequestRedirect
      requestRedirect:
        statusCode: 302
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: {{ $centralPathPrefix }}
  {{- end }}
  - matches:
    - path:
        type: PathPrefix
        value: /victoriametrics/robots/vmalert
    filters:
    - type: RequestRedirect
      requestRedirect:
        statusCode: 302
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /victoriametrics/cloud/vmalert
  - matches:
    - path:
        type: PathPrefix
        value: /victoriametrics/robots/select
    filters:
    - type: RequestRedirect
      requestRedirect:
        statusCode: 302
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /victoriametrics/cloud/select
  - matches:
    - path:
        type: PathPrefix
        value: /victoriametrics/robots
    filters:
    - type: RequestRedirect
      requestRedirect:
        statusCode: 302
        path:
          type: ReplaceFullPath
          replaceFullPath: /victoriametrics/cloud/select/0/prometheus/vmui/
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: victoriametrics-cloudmetrics-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: victoriametrics-cloudmetrics
  extAuth:
    {{- if .Values.victoriametrics_cloudmetrics_auth_backend.contextExtensions }}
    contextExtensions:
      {{- range $k, $v := .Values.victoriametrics_cloudmetrics_auth_backend.contextExtensions }}
      - name: {{ $k }}
        value: {{ $v | quote }}
      {{- end }}
    {{- end }}
    headersToExtAuth:
      {{- toYaml .Values.authProxy.authHeaders | nindent 6 }}
    {{- if eq (default "http" .Values.victoriametrics_cloudmetrics_auth_backend.protocol) "grpc" }}
    grpc:
      backendRefs:
      - name: {{ .Values.victoriametrics_cloudmetrics_auth_backend.service }}
        {{- if .Values.victoriametrics_cloudmetrics_auth_backend.namespace }}
        namespace: {{ .Values.victoriametrics_cloudmetrics_auth_backend.namespace }}
        {{- end }}
        port: {{ .Values.victoriametrics_cloudmetrics_auth_backend.port }}
    {{- else }}
    http:
      path: {{ .Values.victoriametrics_cloudmetrics_auth_backend.path }}
      backendRefs:
      - name: {{ .Values.victoriametrics_cloudmetrics_auth_backend.service }}
        {{- if .Values.victoriametrics_cloudmetrics_auth_backend.namespace }}
        namespace: {{ .Values.victoriametrics_cloudmetrics_auth_backend.namespace }}
        {{- end }}
        port: {{ .Values.victoriametrics_cloudmetrics_auth_backend.port }}
    {{- end }}
