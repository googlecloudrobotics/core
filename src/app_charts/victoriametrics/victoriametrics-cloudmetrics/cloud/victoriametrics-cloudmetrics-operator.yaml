# This includes all resources expanded from the victoria-metrics-k8s-stack chart using
# the values in ../values-cloud.yaml.
# Some pseudo-variables that were inserted there are replaced with actual runtime values.
{{- $data := .Files.Get "files/victoriametrics-cloudmetrics-chart.cloud.yaml" -}}

# Scalar Replacements
{{- $vminsertPort := 8480 -}}
{{- $vmselectPort := 8481 -}}
{{- if .Values.vmcluster }}
  {{- if .Values.vmcluster.spec }}
    {{- if .Values.vmcluster.spec.vmstorage }}
      {{- $data = $data | replace "${VMSTORAGE_REPLICA_COUNT}" (toString .Values.vmcluster.spec.vmstorage.replicaCount) -}}
    {{- end }}
    {{- if .Values.vmcluster.spec.vminsert }}
      {{- $data = $data | replace "${VMINSERT_REPLICA_COUNT}" (toString .Values.vmcluster.spec.vminsert.replicaCount) -}}
      {{- if .Values.vmcluster.spec.vminsert.port }}
        {{- $vminsertPort = .Values.vmcluster.spec.vminsert.port -}}
      {{- end }}
    {{- end }}
    {{- if .Values.vmcluster.spec.vmselect }}
      {{- $data = $data | replace "${VMSELECT_REPLICA_COUNT}" (toString .Values.vmcluster.spec.vmselect.replicaCount) -}}
      {{- if .Values.vmcluster.spec.vmselect.port }}
        {{- $vmselectPort = .Values.vmcluster.spec.vmselect.port -}}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
# Port replacements: Ensure standalone 'port:' keys are quoted strings for Kubernetes CRD schema compliance, while keeping URL ports unquoted.
{{- $data = $data | replace (printf "\"${CR_VICTORIAMETRICS_CLOUDMETRICS_VMINSERT_PORT}\"") (printf "\"%s\"" (toString $vminsertPort)) -}}
{{- $data = $data | replace "port: ${CR_VICTORIAMETRICS_CLOUDMETRICS_VMINSERT_PORT}" (printf "port: \"%s\"" (toString $vminsertPort)) -}}
{{- $data = $data | replace "${CR_VICTORIAMETRICS_CLOUDMETRICS_VMINSERT_PORT}" (toString $vminsertPort) -}}
{{- $data = $data | replace (printf "\"${CR_VICTORIAMETRICS_CLOUDMETRICS_VMSELECT_PORT}\"") (printf "\"%s\"" (toString $vmselectPort)) -}}
{{- $data = $data | replace "port: ${CR_VICTORIAMETRICS_CLOUDMETRICS_VMSELECT_PORT}" (printf "port: \"%s\"" (toString $vmselectPort)) -}}
{{- $data = $data | replace "${CR_VICTORIAMETRICS_CLOUDMETRICS_VMSELECT_PORT}" (toString $vmselectPort) -}}

{{- $nodeExporterPort := 9111 -}}
{{- if index .Values "prometheus-node-exporter" -}}
  {{- if index (index .Values "prometheus-node-exporter") "service" -}}
    {{- if index (index (index .Values "prometheus-node-exporter") "service") "port" -}}
      {{- $nodeExporterPort = index (index (index .Values "prometheus-node-exporter") "service") "port" -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- $data = $data | replace (printf "\"${CR_VICTORIAMETRICS_CLOUDMETRICS_NODE_EXPORTER_PORT}\"") (toString $nodeExporterPort) -}}
{{- $data = $data | replace "${CR_VICTORIAMETRICS_CLOUDMETRICS_NODE_EXPORTER_PORT}" (toString $nodeExporterPort) -}}

{{- $requestsStorage := "100Gi" -}}
{{- if .Values.vmcluster -}}
  {{- if .Values.vmcluster.spec -}}
    {{- if .Values.vmcluster.spec.vmstorage -}}
      {{- if .Values.vmcluster.spec.vmstorage.storage -}}
        {{- if .Values.vmcluster.spec.vmstorage.storage.requests -}}
          {{- if .Values.vmcluster.spec.vmstorage.storage.requests.storage -}}
            {{- $requestsStorage = .Values.vmcluster.spec.vmstorage.storage.requests.storage -}}
          {{- end -}}
        {{- else if .Values.vmcluster.spec.vmstorage.storage.volumeClaimTemplate -}}
          {{- if .Values.vmcluster.spec.vmstorage.storage.volumeClaimTemplate.spec -}}
            {{- if .Values.vmcluster.spec.vmstorage.storage.volumeClaimTemplate.spec.resources -}}
              {{- if .Values.vmcluster.spec.vmstorage.storage.volumeClaimTemplate.spec.resources.requests -}}
                {{- if .Values.vmcluster.spec.vmstorage.storage.volumeClaimTemplate.spec.resources.requests.storage -}}
                  {{- $requestsStorage = .Values.vmcluster.spec.vmstorage.storage.volumeClaimTemplate.spec.resources.requests.storage -}}
                {{- end -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if .Values.requests -}}
  {{- if .Values.requests.storage -}}
    {{- $requestsStorage = .Values.requests.storage -}}
  {{- end -}}
{{- end -}}
{{- $data = $data | replace "${VMSTORAGE_REQUESTS_STORAGE}" $requestsStorage -}}

{{- $retentionTime := .Values.retention.time -}}
{{- if .Values.vmcluster -}}
  {{- if .Values.vmcluster.spec -}}
    {{- if .Values.vmcluster.spec.retentionPeriod -}}
      {{- $retentionTime = .Values.vmcluster.spec.retentionPeriod -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- $data = $data | replace "${VMCLUSTER_RETENTION_TIME}" $retentionTime -}}

{{- $replicationFactor := .Values.replicationFactor -}}
{{- if .Values.vmcluster -}}
  {{- if .Values.vmcluster.spec -}}
    {{- if .Values.vmcluster.spec.replicationFactor -}}
      {{- $replicationFactor = .Values.vmcluster.spec.replicationFactor -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- $data = $data | replace "${VMCLUSTER_REPLICATION_FACTOR}" (toString $replicationFactor) -}}
{{- $data = $data | replace "${VMINSERT_REPLICATION_FACTOR}" (printf "\"%s\"" (toString $replicationFactor)) -}}
{{- $data = $data | replace "${VMAGENT_TMP_DATA_PATH}" (default "/tmp/vmagent-remotewrite-data" .Values.vmagent.tmp_data_path) -}}
{{- $data = $data | replace "${VMAGENT_MAX_DISK_USAGE}" (default "5GB" .Values.vmagent.max_disk_usage) -}}
{{- $data = $data | replace "${VMAGENT_ALLOWED_BYTES}" (default "200MB" .Values.vmagent.allowed_bytes) -}}
{{- $data = $data | replace "${VMAGENT_MEMORY_REQUEST}" (default "512Mi" .Values.vmagent.memory_request) -}}
{{- $data = $data | replace "${VMAGENT_MEMORY_LIMIT}" (default "512Mi" .Values.vmagent.memory_limit) -}}
{{- $data = $data | replace "HELM-NAMESPACE" .Release.Namespace -}}

# Inject the vmstorage resources
{{- $vmstorageResourcesMap := dict "limits" (dict "cpu" .Values.limits.cpu "memory" .Values.limits.memory) -}}
{{- if .Values.vmcluster -}}
  {{- if .Values.vmcluster.spec -}}
    {{- if .Values.vmcluster.spec.vmstorage -}}
      {{- if .Values.vmcluster.spec.vmstorage.resources -}}
        {{- $vmstorageResourcesMap = .Values.vmcluster.spec.vmstorage.resources -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if $vmstorageResourcesMap }}
  {{- $formattedResources := toYaml $vmstorageResourcesMap | nindent 6 -}}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_CLOUDMETRICS_VMSTORAGE_RESOURCES_OBJECT: REMOVE_ME" (trimPrefix "      " (trimPrefix "\n" $formattedResources)) -}}
{{- else }}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_CLOUDMETRICS_VMSTORAGE_RESOURCES_OBJECT: REMOVE_ME" "{}" -}}
{{- end }}

