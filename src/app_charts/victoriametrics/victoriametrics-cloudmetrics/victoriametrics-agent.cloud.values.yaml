# Cloud-side vmagent for the cloud-metrics VictoriaMetrics stack. This
# instance scrapes metrics from the cloud cluster itself (kube-state-metrics
# and kubelet/cAdvisor targets), distinct from the robot-side vmagent that
# scrapes robot-local exporters. Pinned to 0.45.0 (appVersion v1.149.0), same as the
# robot instance (see victoriametrics-agent.robot.values.yaml).
#
# WARNING: If you edit this file, run the following command to generate
# the output with `helm template`, and verify that your changes have
# the expected effect.
#
#   bazel build src/app_charts/victoriametrics-cloudmetrics/vmagent-chart.cloud.yaml

extraContainers:
  - "${CR_VICTORIAMETRICS_CLOUD_EXTRA_CONTAINERS_OBJECT}"
extraVolumes:
  - "${CR_VICTORIAMETRICS_CLOUD_EXTRA_VOLUMES_OBJECT}"
extraVolumeMounts:
  - "${CR_VICTORIAMETRICS_CLOUD_EXTRA_VOLUME_MOUNTS_OBJECT}"

remoteWrite:
  # Same-cluster traffic - talks directly to the local vminsert
  # service, no Aqualine tunnel or API-key auth needed since this
  # never leaves the cluster (unlike robot-side vmagent's traffic,
  # which crosses the on-prem/cloud boundary).
  - url: "http://${RELEASE_NAME}-victoria-metrics-cluster-vminsert:${VMINSERT_PORT}/insert/0/prometheus/api/v1/write"

rbac:
  pspEnabled: false

serviceAccount:
  annotations:
    gcp-service-account-placeholder: "${CR_VICTORIAMETRICS_CLOUD_GCP_SERVICE_ACCOUNT}"

extraArgs:
  envflag.enable: true
  envflag.prefix: VM_
  loggerFormat: json

config:
  global:
    scrape_interval: 30s
  scrape_configs:
    # Dynamically discover and scrape any pod in the cluster annotated with
    # prometheus.io/scrape: "true". This replaces the legacy Cloud Prometheus
    # universal discovery pattern.
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          regex: "true"
          action: keep
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          regex: (.+)
          action: replace
          target_label: __metrics_path__
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          regex: ([^:]+)(?::\d+)?;(\d+)
          action: replace
          target_label: __address__
          replacement: $1:$2
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: kubernetes_pod_name
    - job_name: kube-state-metrics

      kubernetes_sd_configs:
        - role: endpoints
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
          regex: kube-state-metrics
          action: keep
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          regex: http
          action: keep
    - job_name: kubelet
      kubernetes_sd_configs:
        - role: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
    - job_name: kubelet-cadvisor
      kubernetes_sd_configs:
        - role: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      metrics_path: /metrics/cadvisor
