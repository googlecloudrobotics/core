# Configuration for the victoria-metrics-k8s-stack chart for the cloud ingestion target.
# Reference:
# https://github.com/VictoriaMetrics/helm-charts/blob/victoria-metrics-k8s-stack-0.91.0/charts/victoria-metrics-k8s-stack/values.yaml
#
# This chart deploys the central aggregation vmagent (`vmagent-vmr`).
#
# WARNING: If you edit this file, run the following command to generate
# the output with `helm template`, and verify that your changes have
# the expected effect.
#
#   bazel build src/app_charts/victoriametrics/victoriametrics-robotmetrics:victoriametrics-robotmetrics-chart.cloud

fullnameOverride: "vmr"

vmsingle:
  enabled: false

vmcluster:
  enabled: false

vmalert:
  enabled: false

vmalertmanager:
  enabled: false

alertmanager:
  enabled: false

defaultRules:
  create: false

vmagent:
  enabled: true
  additionalRemoteWrites:
    - $CR_VICTORIAMETRICS_ROBOTMETRICS_ADDITIONAL_REMOTE_WRITES_OBJECT: REMOVE_ME
  spec:
    port: "${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_PORT}"
    # Always one replica: stream aggregation needs every sample of a series on one instance.
    replicaCount: 1
    # The central aggregator only receives remote writes from robot vmagents and the cloud vmagent.
    selectAllByDefault: false
    # Primary destination (the single vmcluster's vminsert), replaced at deploy time.
    remoteWrite:
      - $CR_VICTORIAMETRICS_ROBOTMETRICS_REMOTE_WRITE_OBJECT: REMOVE_ME
    # Global stream aggregation applied to all incoming samples before they are
    # forwarded to every remoteWrite destination. Replaced (or removed) at deploy time.
    streamAggrConfig:
      $CR_VICTORIAMETRICS_ROBOTMETRICS_STREAM_AGGR_CONFIG_OBJECT: REMOVE_ME
    externalLabels:
      $CR_VICTORIAMETRICS_ROBOTMETRICS_EXTERNAL_LABELS_OBJECT: REMOVE_ME
    nodeSelector:
      $CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_NODE_SELECTOR_OBJECT: REMOVE_ME
    tolerations:
      - $CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_TOLERATIONS_OBJECT: REMOVE_ME
    serviceScrapeSelector:
      $CR_VICTORIAMETRICS_ROBOTMETRICS_SERVICE_SCRAPE_SELECTOR_OBJECT: REMOVE_ME
    serviceScrapeNamespaceSelector:
      $CR_VICTORIAMETRICS_ROBOTMETRICS_SERVICE_SCRAPE_NAMESPACE_SELECTOR_OBJECT: REMOVE_ME
    podScrapeSelector:
      $CR_VICTORIAMETRICS_ROBOTMETRICS_POD_SCRAPE_SELECTOR_OBJECT: REMOVE_ME
    podScrapeNamespaceSelector:
      $CR_VICTORIAMETRICS_ROBOTMETRICS_POD_SCRAPE_NAMESPACE_SELECTOR_OBJECT: REMOVE_ME
    nodeScrapeSelector:
      $CR_VICTORIAMETRICS_ROBOTMETRICS_NODE_SCRAPE_SELECTOR_OBJECT: REMOVE_ME
    nodeScrapeNamespaceSelector:
      $CR_VICTORIAMETRICS_ROBOTMETRICS_NODE_SCRAPE_NAMESPACE_SELECTOR_OBJECT: REMOVE_ME
    probeSelector:
      $CR_VICTORIAMETRICS_ROBOTMETRICS_PROBE_SELECTOR_OBJECT: REMOVE_ME
    probeNamespaceSelector:
      $CR_VICTORIAMETRICS_ROBOTMETRICS_PROBE_NAMESPACE_SELECTOR_OBJECT: REMOVE_ME
    staticScrapeSelector:
      $CR_VICTORIAMETRICS_ROBOTMETRICS_STATIC_SCRAPE_SELECTOR_OBJECT: REMOVE_ME
    staticScrapeNamespaceSelector:
      $CR_VICTORIAMETRICS_ROBOTMETRICS_STATIC_SCRAPE_NAMESPACE_SELECTOR_OBJECT: REMOVE_ME

    extraArgs:
      http.pathPrefix: "/victoriametrics/robots/vmagent"
      $CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_ARGS_OBJECT: REMOVE_ME

    resources:
      $CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_RESOURCES_OBJECT: REMOVE_ME

    containers:
      - $CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_CONTAINERS_OBJECT: REMOVE_ME
    volumes:
      - $CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_VOLUMES_OBJECT: REMOVE_ME
    volumeMounts:
      - $CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_VOLUME_MOUNTS_OBJECT: REMOVE_ME

serviceAccount:
  annotations:
    "${CR_VICTORIAMETRICS_ROBOTMETRICS_SA_ANNOTATIONS}": ""

# Disable extra exporters as they are not needed on the central aggregator
victoria-metrics-operator:
  enabled: false

grafana:
  enabled: false

prometheus-node-exporter:
  enabled: false

kube-state-metrics:
  enabled: false

kubelet:
  enabled: false

kubeApiServer:
  enabled: false

# etcd, scheduler, and controller-manager are managed by GKE and hidden.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
coreDns:
  enabled: false

# Throws an invalid namespace "kube-system" error during deployment, as this is
# trying to install resources into the kube-system namespace, which synk does
# not support.
kubeProxy:
  enabled: false
