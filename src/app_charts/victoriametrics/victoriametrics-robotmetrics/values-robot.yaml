# App-chart-level values consumed by robot/victoriametrics-robotmetrics-operator.yaml's
# pseudo-variable replace chain.
#
# Must be set per deployment under AppRollout spec.robots[].values.
victoriametrics_robotmetrics_remote_write_url: ""

# Optional upstream integration for an external metrics consumer. Sidecar fields
# are structured YAML fragments for injecting an authorization sidecar into
# robot vmagent; metrics fields add a second remote_write target with its own
# relabel filter. remote_write_labels accepts key=value strings rendered as
# repeated -remoteWrite.label flags; metrics_relabel_config accepts relabel
# rule objects rendered into upstream-relabel.yml.
# Empty by default, no effect on existing projects.
upstream:
  sidecar_containers: []
  sidecar_volumes: []
  sidecar_volume_mounts: []
  remote_write_labels: []
  metrics_url: ""
  metrics_relabel_config: []
