# Configuration for the victoria-metrics-agent chart (vmagent).
# Pinned to chart version 0.45.0 (appVersion v1.149.0). CRC now uses
# Helm 3.21.3, which supports the victoria-metrics-common templates used
# by this chart.
#
# WARNING: If you edit this file, run the following command to generate
# the output with `helm template`, and verify that your changes have
# the expected effect.
#
#   bazel build src/app_charts/victoriametrics-robotmetrics/vmagent-chart.robot.yaml

extraContainers:
  - "${CR_VICTORIAMETRICS_ROBOT_EXTRA_CONTAINERS_OBJECT}"
extraVolumes:
  - "${CR_VICTORIAMETRICS_ROBOT_EXTRA_VOLUMES_OBJECT}"
extraVolumeMounts:
  - "${CR_VICTORIAMETRICS_ROBOT_EXTRA_VOLUME_MOUNTS_OBJECT}"

remoteWrite:
  - url: "${CR_VICTORIAMETRICS_ROBOTMETRICS_REMOTE_WRITE_URL}"

extraArgs:
  envflag.enable: true
  envflag.prefix: VM_
  loggerFormat: json

rbac:
  pspEnabled: false

# The remote_write endpoint requires machine-to-machine auth via the
# auth-proxy's apikey scope (see cloud/vm-write-ingress.yaml), since
# the browser-oriented internal scope can't be completed by a
# non-interactive client. Bearer token supplied via env var, which
# vmagent maps to -remoteWrite.bearerToken via its envflag mechanism
# (envflag.enable=true, envflag.prefix=VM_, already set in extraArgs).
env:
  - name: VM_remoteWrite_bearerToken
    valueFrom:
      secretKeyRef:
        name: robot-auth
        key: json

config:
  global:
    scrape_interval: 30s
  scrape_configs:
    - job_name: node-exporter
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          regex: node-exporter
          action: keep
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: instance
        - source_labels: [__address__]
          regex: '([^:]+)(?::\d+)?'
          target_label: __address__
          replacement: '${1}:19100'
      metric_relabel_configs:
        - source_labels: [__name__]
          regex: "node_cpu_seconds_total"
          action: drop
    - job_name: smartctl-exporter
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          regex: smartctl-exporter
          action: keep
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: instance
        - source_labels: [__address__]
          regex: '(.*)'
          target_label: __address__
          replacement: '${1}:9633'
