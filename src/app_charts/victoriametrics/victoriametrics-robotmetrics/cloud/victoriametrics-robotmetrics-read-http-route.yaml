{{- $vmagentPort := 8429 -}}
{{- if .Values.vmagent }}
  {{- if .Values.vmagent.spec }}
    {{- if .Values.vmagent.spec.port }}
      {{- $vmagentPort = .Values.vmagent.spec.port -}}
    {{- end }}
  {{- end }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoriametrics-robotmetrics
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  hostnames:
  - {{ .Values.domain }}
  parentRefs:
  - name: crc-gateway
    namespace: default
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /victoriametrics/robots/vmagent
    backendRefs:
    - name: vmagent-vmr
      port: {{ $vmagentPort }}
  - matches:
    - path:
        type: PathPrefix
        value: /victoriametrics/robots/vmalert
    filters:
    - type: RequestRedirect
      requestRedirect:
        statusCode: 302
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /victoriametrics/cloud/vmalert
  - matches:
    - path:
        type: PathPrefix
        value: /victoriametrics/robots/select
    filters:
    - type: RequestRedirect
      requestRedirect:
        statusCode: 302
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /victoriametrics/cloud/select
  - matches:
    - path:
        type: PathPrefix
        value: /victoriametrics/robots
    filters:
    - type: RequestRedirect
      requestRedirect:
        statusCode: 302
        path:
          type: ReplaceFullPath
          replaceFullPath: /victoriametrics/cloud/select/0/prometheus/vmui/
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: victoriametrics-robotmetrics-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: victoriametrics-robotmetrics
  extAuth:
    {{- if .Values.victoriametrics_robotmetrics_auth_backend.contextExtensions }}
    contextExtensions:
      {{- range $k, $v := .Values.victoriametrics_robotmetrics_auth_backend.contextExtensions }}
      - name: {{ $k }}
        value: {{ $v | quote }}
      {{- end }}
    {{- end }}
    headersToExtAuth:
      {{- toYaml .Values.authProxy.authHeaders | nindent 6 }}
    {{- if eq (default "http" .Values.victoriametrics_robotmetrics_auth_backend.protocol) "grpc" }}
    grpc:
      backendRefs:
      - name: {{ .Values.victoriametrics_robotmetrics_auth_backend.service }}
        {{- if .Values.victoriametrics_robotmetrics_auth_backend.namespace }}
        namespace: {{ .Values.victoriametrics_robotmetrics_auth_backend.namespace }}
        {{- end }}
        port: {{ .Values.victoriametrics_robotmetrics_auth_backend.port }}
    {{- else }}
    http:
      path: {{ .Values.victoriametrics_robotmetrics_auth_backend.path }}
      backendRefs:
      - name: {{ .Values.victoriametrics_robotmetrics_auth_backend.service }}
        {{- if .Values.victoriametrics_robotmetrics_auth_backend.namespace }}
        namespace: {{ .Values.victoriametrics_robotmetrics_auth_backend.namespace }}
        {{- end }}
        port: {{ .Values.victoriametrics_robotmetrics_auth_backend.port }}
    {{- end }}
