{{- $vmselectPort := 8481 -}}
{{- $vmagentPort := 8429 -}}
{{- $vmalertPort := 8080 -}}
{{- if .Values.vmcluster -}}
  {{- if .Values.vmcluster.spec -}}
    {{- if .Values.vmcluster.spec.vmselect -}}
      {{- $vmselectPort = .Values.vmcluster.spec.vmselect.port | default 8481 -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if .Values.vmagent -}}
  {{- if .Values.vmagent.spec -}}
    {{- $vmagentPort = .Values.vmagent.spec.port | default 8429 -}}
  {{- end -}}
{{- end -}}
{{- if .Values.vmalert -}}
  {{- if .Values.vmalert.spec -}}
    {{- $vmalertPort = .Values.vmalert.spec.port | default 8080 -}}
  {{- end -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: victoriametrics-robotmetrics
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "{{ tpl .Values.victoriametrics_robotmetrics_ingress_auth_url . }}"
    nginx.ingress.kubernetes.io/auth-signin: "{{ tpl .Values.victoriametrics_robotmetrics_ingress_auth_signin . }}"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/configuration-snippet: |
      error_page 403 = {{ tpl .Values.victoriametrics_robotmetrics_ingress_error_page_403 . }};
      rewrite ^/victoriametrics/robots/?$ /victoriametrics/robots/select/0/prometheus/vmui redirect;
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.domain }}
    http:
      paths:
      # Main VMUI and Prometheus Query API
      - path: /victoriametrics/robots
        pathType: Prefix
        backend:
          service:
            name: vmselect-vmr
            port:
              number: {{ $vmselectPort }}
      # Alerts Dashboard
      - path: /victoriametrics/robots/vmalert
        pathType: Prefix
        backend:
          service:
            name: vmalert-vmr
            port:
              number: {{ $vmalertPort }}
      # Scraper Targets and Service Discovery Dashboard
      - path: /victoriametrics/robots/vmagent
        pathType: Prefix
        backend:
          service:
            name: vmagent-vmr
            port:
              number: {{ $vmagentPort }}
