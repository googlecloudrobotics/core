{{- $vmagentPort := 8429 -}}
{{- if .Values.vmagent -}}
  {{- if .Values.vmagent.spec -}}
    {{- $vmagentPort = .Values.vmagent.spec.port | default 8429 -}}
  {{- end -}}
{{- end -}}
# Robot metrics are now stored in the single per-project vmcluster owned by the
# victoriametrics-cloudmetrics chart. The legacy /victoriametrics/robots query and
# alert UIs are redirected there; only the central aggregator's own UI
# (/victoriametrics/robots/vmagent) is still served from this chart.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: victoriametrics-robotmetrics
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "{{ tpl .Values.victoriametrics_robotmetrics_ingress_auth_url . }}"
    nginx.ingress.kubernetes.io/auth-signin: "{{ tpl .Values.victoriametrics_robotmetrics_ingress_auth_signin . }}"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/configuration-snippet: |
      error_page 403 = {{ tpl .Values.victoriametrics_robotmetrics_ingress_error_page_403 . }};
      rewrite ^/victoriametrics/robots/(select|vmalert)(.*)$ /victoriametrics/cloud/$1$2 redirect;
      rewrite ^/victoriametrics/robots/?$ /victoriametrics/cloud/select/0/prometheus/vmui/ redirect;
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.domain }}
    http:
      paths:
      # Central aggregator targets / status UI.
      - path: /victoriametrics/robots
        pathType: Prefix
        backend:
          service:
            name: vmagent-vmr
            port:
              number: {{ $vmagentPort }}
