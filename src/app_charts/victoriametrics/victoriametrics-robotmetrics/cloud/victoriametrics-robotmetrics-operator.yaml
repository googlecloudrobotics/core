# This includes all resources expanded from the victoria-metrics-k8s-stack chart using
# the values in ../victoriametrics-robotmetrics-cloud.values.yaml for the cloud target.
# The cloud target only contains the central aggregation vmagent (vmagent-vmr); the
# single per-project vmcluster is owned by the victoriametrics-cloudmetrics chart.
# Some pseudo-variables that were inserted there are replaced with actual runtime values.
{{- $data := .Files.Get "files/victoriametrics-robotmetrics-chart.cloud.yaml" -}}

# Scalar Replacements
{{- $vmagentPort := 8429 -}}
{{- if .Values.vmagent }}
  {{- if .Values.vmagent.spec }}
    {{- if .Values.vmagent.spec.port }}
      {{- $vmagentPort = .Values.vmagent.spec.port -}}
    {{- end }}
    {{- /*
      The central aggregator always runs exactly one replica: stream aggregation is only
      correct if every sample of a series reaches the same vmagent instance.
    */ -}}
    {{- if and .Values.vmagent.spec.replicaCount (ne (int .Values.vmagent.spec.replicaCount) 1) }}
      {{- fail "victoriametrics-robotmetrics: the central vmagent (vmagent-vmr) runs exactly one replica; vmagent.spec.replicaCount must be unset or 1." }}
    {{- end }}
  {{- end }}
{{- end }}
# Port replacements: Ensure standalone 'port:' keys are quoted strings for Kubernetes CRD schema compliance, while keeping URL ports unquoted.
{{- $data = $data | replace (printf "\"${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_PORT}\"") (printf "\"%s\"" (toString $vmagentPort)) -}}
{{- $data = $data | replace "port: ${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_PORT}" (printf "port: \"%s\"" (toString $vmagentPort)) -}}
{{- $data = $data | replace "${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_PORT}" (toString $vmagentPort) -}}
{{- $data = $data | replace "${RELEASE_NAME}" .Release.Name -}}
{{- $data = $data | replace "HELM-NAMESPACE" .Release.Namespace -}}

# Inject the vmagent resources
{{- $vmagentResourcesMap := dict -}}
{{- if .Values.vmagent -}}
  {{- if .Values.vmagent.spec -}}
    {{- if .Values.vmagent.spec.resources -}}
      {{- $vmagentResourcesMap = .Values.vmagent.spec.resources -}}
    {{- end -}}
  {{- else if .Values.vmagent.resources -}}
    {{- $vmagentResourcesMap = .Values.vmagent.resources -}}
  {{- end -}}
{{- end -}}
{{- if $vmagentResourcesMap }}
  {{- $formattedResources := toYaml $vmagentResourcesMap | nindent 4 -}}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_RESOURCES_OBJECT: REMOVE_ME" (trimPrefix "    " (trimPrefix "\n" $formattedResources)) -}}
{{- else }}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_RESOURCES_OBJECT: REMOVE_ME" "{}" -}}
{{- end }}

# Inject the nodeSelector and tolerations for vmagent
{{- $vmagentNodeSelectorMap := dict -}}
{{- if .Values.vmagent -}}
  {{- if .Values.vmagent.spec -}}
    {{- if .Values.vmagent.spec.nodeSelector -}}
      {{- $vmagentNodeSelectorMap = .Values.vmagent.spec.nodeSelector -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if $vmagentNodeSelectorMap }}
  {{- $formattedNodeSelector := toYaml $vmagentNodeSelectorMap | nindent 4 -}}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_NODE_SELECTOR_OBJECT: REMOVE_ME" (trimPrefix "    " (trimPrefix "\n" $formattedNodeSelector)) -}}
{{- else }}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_NODE_SELECTOR_OBJECT: REMOVE_ME" "{}" -}}
{{- end }}

{{- $vmagentTolerationsList := list -}}
{{- if .Values.vmagent -}}
  {{- if .Values.vmagent.spec -}}
    {{- if .Values.vmagent.spec.tolerations -}}
      {{- $vmagentTolerationsList = .Values.vmagent.spec.tolerations -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if $vmagentTolerationsList }}
  {{- $formattedTolerations := toYaml $vmagentTolerationsList | nindent 2 -}}
  {{- $data = $data | replace "- $CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_TOLERATIONS_OBJECT: REMOVE_ME" (trimPrefix "  " (trimPrefix "\n" $formattedTolerations)) -}}
{{- else }}
  {{- $data = $data | replace "  tolerations:\n  - $CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_TOLERATIONS_OBJECT: REMOVE_ME\n" "" -}}
{{- end }}

{{- /*
  Inject remoteWrite: primary destination (the single per-project vmcluster, or
  vmagent.spec.remoteWrite if set explicitly) followed by additionalRemoteWrites.
  The upstream chart renders the additionalRemoteWrites placeholder item first and
  the spec.remoteWrite placeholder item second; the former is dropped and the
  latter replaced with the full list.
*/ -}}
{{- $remoteWriteList := list -}}
{{- if .Values.vmagent -}}
  {{- if .Values.vmagent.spec -}}
    {{- if .Values.vmagent.spec.remoteWrite -}}
      {{- $remoteWriteList = .Values.vmagent.spec.remoteWrite -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if not $remoteWriteList -}}
  {{- if .Values.victoriametrics_robotmetrics_central_remote_write_url -}}
    {{- $remoteWriteList = append $remoteWriteList (dict "url" .Values.victoriametrics_robotmetrics_central_remote_write_url) -}}
  {{- end -}}
{{- end -}}
{{- if .Values.vmagent }}
  {{- if .Values.vmagent.additionalRemoteWrites }}
    {{- range .Values.vmagent.additionalRemoteWrites }}
      {{- $remoteWriteList = append $remoteWriteList . -}}
    {{- end }}
  {{- end }}
{{- end }}

{{- /*
  Optional external remote-write destination (any Prometheus remote-write
  compatible endpoint). Appended after the primary destination and any
  additionalRemoteWrites, with its own tenant header, per-URL relabeling and
  per-URL stream aggregation (applied only to what is sent to this endpoint; the
  vmcluster keeps the full-resolution stream unless vmagent.spec.streamAggrConfig
  is also set).
*/ -}}
{{- $ext := .Values.externalRemoteWrite | default dict -}}
{{- $extIndex := -1 -}}
{{- if $ext.enabled }}
  {{- if not $ext.url }}
    {{- fail "victoriametrics-robotmetrics: externalRemoteWrite.enabled=true needs externalRemoteWrite.url (e.g. https://<host>/api/v1/write)" }}
  {{- end }}
  {{- $extRW := dict "url" $ext.url -}}
  {{- $extHeaders := list -}}
  {{- $tenant := $ext.tenant | default .Values.project -}}
  {{- if $tenant }}
    {{- $extHeaders = append $extHeaders (printf "X-Scope-OrgID: %s" $tenant) -}}
  {{- end }}
  {{- range ($ext.headers | default list) }}
    {{- $extHeaders = append $extHeaders . -}}
  {{- end }}
  {{- if $extHeaders }}
    {{- $_ := set $extRW "headers" $extHeaders -}}
  {{- end }}
  {{- range $key := list "inlineUrlRelabelConfig" "streamAggrConfig" "sendTimeout" "tlsConfig" "basicAuth" "bearerTokenSecret" "oauth2" }}
    {{- with index $ext $key }}
      {{- $_ := set $extRW $key . -}}
    {{- end }}
  {{- end }}
  {{- $extIndex = len $remoteWriteList -}}
  {{- $remoteWriteList = append $remoteWriteList $extRW -}}
{{- end }}
{{- if not $remoteWriteList }}
  {{- fail "victoriametrics-robotmetrics: the central vmagent needs at least one remoteWrite destination; set victoriametrics_robotmetrics_central_remote_write_url" }}
{{- end }}

{{- $bearerTokenFileArg := "" -}}
{{- if and $ext.enabled $ext.bearerTokenFile }}
  {{- if or $ext.bearerTokenSecret $ext.basicAuth $ext.oauth2 }}
    {{- fail "victoriametrics-robotmetrics: set only one of externalRemoteWrite.bearerTokenFile, externalRemoteWrite.bearerTokenSecret, externalRemoteWrite.basicAuth or externalRemoteWrite.oauth2" }}
  {{- end }}
  {{- range $rw := $remoteWriteList }}
    {{- if $rw.bearerTokenSecret }}
      {{- fail "victoriametrics-robotmetrics: externalRemoteWrite.bearerTokenFile cannot be combined with bearerTokenSecret on another remoteWrite destination" }}
    {{- end }}
  {{- end }}
  {{- $files := list -}}
  {{- range $i, $rw := $remoteWriteList }}
    {{- $files = append $files (ternary $ext.bearerTokenFile "" (eq $i $extIndex)) -}}
  {{- end }}
  {{- $bearerTokenFileArg = join "," $files -}}
{{- end }}
{{- $formattedRemoteWriteObject := toYaml $remoteWriteList | nindent 2 -}}
{{- $data = $data | replace "  - $CR_VICTORIAMETRICS_ROBOTMETRICS_ADDITIONAL_REMOTE_WRITES_OBJECT: REMOVE_ME\n" "" -}}
{{- $data = $data | replace "- $CR_VICTORIAMETRICS_ROBOTMETRICS_REMOTE_WRITE_OBJECT: REMOVE_ME" (trimPrefix "  " (trimPrefix "\n" $formattedRemoteWriteObject)) -}}

# Inject extraArgs for vmagent
{{- $vmagentExtraArgsMap := dict -}}
{{- if .Values.vmagent -}}
  {{- if .Values.vmagent.spec -}}
    {{- if .Values.vmagent.spec.extraArgs -}}
      {{- $vmagentExtraArgsMap = .Values.vmagent.spec.extraArgs -}}
    {{- end -}}
  {{- else if .Values.vmagent.extraArgs -}}
    {{- $vmagentExtraArgsMap = .Values.vmagent.extraArgs -}}
  {{- end -}}
{{- end -}}
{{- if $bearerTokenFileArg }}
  {{- if hasKey $vmagentExtraArgsMap "remoteWrite.bearerTokenFile" }}
    {{- fail "victoriametrics-robotmetrics: do not set vmagent.spec.extraArgs.remoteWrite.bearerTokenFile together with externalRemoteWrite.bearerTokenFile" }}
  {{- end }}
  {{- $vmagentExtraArgsMap = merge (dict "remoteWrite.bearerTokenFile" $bearerTokenFileArg) (deepCopy $vmagentExtraArgsMap) -}}
{{- end }}
{{- if $vmagentExtraArgsMap }}
  {{- $formattedExtraArgs := toYaml $vmagentExtraArgsMap | nindent 4 -}}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_ARGS_OBJECT: REMOVE_ME" (trimPrefix "    " (trimPrefix "\n" $formattedExtraArgs)) -}}
{{- else }}
  {{- $data = $data | replace "      $CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_ARGS_OBJECT: REMOVE_ME\n" "" -}}
  {{- $data = $data | replace "    $CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_ARGS_OBJECT: REMOVE_ME\n" "" -}}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_ARGS_OBJECT: REMOVE_ME\n" "" -}}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_ARGS_OBJECT: REMOVE_ME" "" -}}
{{- end }}

