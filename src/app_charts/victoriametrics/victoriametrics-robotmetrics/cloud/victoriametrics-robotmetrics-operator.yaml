  {{- end }}
{{- end }}
{{- if $volumesList }}
  {{- $formattedVolumesObject := toYaml $volumesList | nindent 4 -}}
  {{- $data = $data | replace "  - name: \"${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_VOLUMES_OBJECT}\"" (printf "\n%s" (trimPrefix "\n" $formattedVolumesObject)) -}}
  {{- $data = $data | replace "  - name: ${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_VOLUMES_OBJECT}" (printf "\n%s" (trimPrefix "\n" $formattedVolumesObject)) -}}
{{- else }}
  {{- $data = $data | replace "  volumes:\n  - name: \"${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_VOLUMES_OBJECT}\"\n" "" -}}
  {{- $data = $data | replace "  volumes:\n  - name: ${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_VOLUMES_OBJECT}\n" "" -}}
{{- end }}

# Inject extra volumeMounts
{{- $volumeMountsList := dict -}}
{{- if .Values.vmagent }}
  {{- if .Values.vmagent.spec }}
    {{- if .Values.vmagent.spec.volumeMounts }}
      {{- $volumeMountsList = .Values.vmagent.spec.volumeMounts -}}
    {{- end }}
  {{- end }}
{{- end }}
{{- if $volumeMountsList }}
  {{- $formattedVolumeMountsObject := toYaml $volumeMountsList | nindent 4 -}}
  {{- $data = $data | replace "  - name: \"${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_VOLUME_MOUNTS_OBJECT}\"" (printf "\n%s" (trimPrefix "\n" $formattedVolumeMountsObject)) -}}
  {{- $data = $data | replace "  - name: ${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_VOLUME_MOUNTS_OBJECT}" (printf "\n%s" (trimPrefix "\n" $formattedVolumeMountsObject)) -}}
{{- else }}
  {{- $data = $data | replace "  volumeMounts:\n  - name: \"${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_VOLUME_MOUNTS_OBJECT}\"\n" "" -}}
  {{- $data = $data | replace "  volumeMounts:\n  - name: ${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_VOLUME_MOUNTS_OBJECT}\n" "" -}}
{{- end }}

---
{{/* Emit rendered VM components */}}
{{ $data }}

# Expand extra objects if any
{{- if .Values.extraObjects }}
{{- range .Values.extraObjects }}
---
{{ toYaml . }}
{{- end }}
{{- end }}
