# Inject Service Account Annotations
{{- $saAnnotationsMap := dict -}}
{{- if .Values.serviceAccount }}
  {{- if .Values.serviceAccount.annotations }}
    {{- $saAnnotationsMap = .Values.serviceAccount.annotations -}}
  {{- end }}
{{- end }}
{{- if .Values.vmagent }}
  {{- if .Values.vmagent.serviceAccount }}
    {{- if .Values.vmagent.serviceAccount.annotations }}
      {{- $saAnnotationsMap = .Values.vmagent.serviceAccount.annotations -}}
    {{- end }}
  {{- end }}
  {{- if .Values.vmagent.spec }}
    {{- if .Values.vmagent.spec.managedMetadata }}
      {{- if .Values.vmagent.spec.managedMetadata.annotations }}
        {{- $saAnnotationsMap = .Values.vmagent.spec.managedMetadata.annotations -}}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if $saAnnotationsMap }}
  {{- $formattedSAAnnotationsObject := toYaml $saAnnotationsMap | indent 4 -}}
