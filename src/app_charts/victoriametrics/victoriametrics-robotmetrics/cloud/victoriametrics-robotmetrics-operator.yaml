{{- else }}
  {{- $data = $data | replace "  annotations:\n    ${CR_VICTORIAMETRICS_ROBOTMETRICS_SA_ANNOTATIONS}: \"\"\n" "" -}}
{{- end }}

# Inject VMAgent managedMetadata (for operator-managed ServiceAccount annotations) and serviceAccountName
{{- $vmagentExtraSpec := "" -}}
{{- if $saAnnotationsMap }}
  {{- $formattedManagedMetadata := dict "managedMetadata" (dict "annotations" $saAnnotationsMap) | toYaml | nindent 2 -}}
  {{- $vmagentExtraSpec = printf "\n%s" $formattedManagedMetadata -}}
{{- end }}
{{- if .Values.vmagent }}
  {{- if .Values.vmagent.spec }}
    {{- if .Values.vmagent.spec.serviceAccountName }}
      {{- $vmagentExtraSpec = printf "%s\n  serviceAccountName: %s" $vmagentExtraSpec .Values.vmagent.spec.serviceAccountName -}}
    {{- end }}
  {{- end }}
{{- end }}
{{- if $vmagentExtraSpec }}
  {{- $data = $data | replace "spec: \n  containers:" (printf "spec:%s\n  containers:" $vmagentExtraSpec) -}}
  {{- $data = $data | replace "spec:\n  containers:" (printf "spec:%s\n  containers:" $vmagentExtraSpec) -}}
{{- end }}

# Inject global stream aggregation config for the central vmagent
{{- $streamAggrConfigMap := dict -}}
{{- if .Values.vmagent -}}
