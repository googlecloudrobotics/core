# Inject remoteWrite
# For the primary edge remote write URL (replaces empty spec.remoteWrite generated by disabled vmcluster)
{{- $remoteWriteList := list -}}
{{- if .Values.vmagent -}}
  {{- if .Values.vmagent.spec -}}
    {{- if .Values.vmagent.spec.remoteWrite -}}
      {{- $remoteWriteList = .Values.vmagent.spec.remoteWrite -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if not $remoteWriteList -}}
  {{- if .Values.victoriametrics_robotmetrics_remote_write_url -}}
    {{- $remoteWriteList = append $remoteWriteList (dict "url" .Values.victoriametrics_robotmetrics_remote_write_url) -}}
  {{- end -}}
{{- end -}}
{{- if $remoteWriteList }}
  {{- $formattedRemoteWriteObject := toYaml $remoteWriteList | nindent 2 -}}
  {{- $data = $data | replace "- $CR_VICTORIAMETRICS_ROBOTMETRICS_REMOTE_WRITE_OBJECT: REMOVE_ME" (trimPrefix "  " (trimPrefix "\n" $formattedRemoteWriteObject)) -}}
{{- else }}
  {{- $data = $data | replace "  - $CR_VICTORIAMETRICS_ROBOTMETRICS_REMOTE_WRITE_OBJECT: REMOVE_ME\n" "" -}}
{{- end }}

