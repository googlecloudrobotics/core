# This includes all resources expanded from the victoria-metrics-k8s-stack chart using
# the values in ../victoriametrics-robotmetrics-robot.values.yaml for the robot edge target.
# Some pseudo-variables that were inserted there are replaced with actual runtime values.
{{- $data := .Files.Get "files/victoriametrics-robotmetrics-chart.robot.yaml" -}}

# Scalar Replacements
{{- $data = $data | replace "${RELEASE_NAME}" .Release.Name -}}

{{- $nodeExporterPort := 9111 -}}
{{- if index .Values "prometheus-node-exporter" -}}
  {{- if index (index .Values "prometheus-node-exporter") "service" -}}
    {{- if index (index (index .Values "prometheus-node-exporter") "service") "port" -}}
      {{- $nodeExporterPort = index (index (index .Values "prometheus-node-exporter") "service") "port" -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- $data = $data | replace (printf "\"${CR_VICTORIAMETRICS_ROBOTMETRICS_NODE_EXPORTER_PORT}\"") (toString $nodeExporterPort) -}}
{{- $data = $data | replace "${CR_VICTORIAMETRICS_ROBOTMETRICS_NODE_EXPORTER_PORT}" (toString $nodeExporterPort) -}}
{{- $data = $data | replace "${VMAGENT_TMP_DATA_PATH}" (default "/tmp/vmagent-remotewrite-data" .Values.vmagent.tmp_data_path) -}}
{{- $data = $data | replace "${VMAGENT_MAX_DISK_USAGE}" (default "5GB" .Values.vmagent.max_disk_usage) -}}
{{- $data = $data | replace "${VMAGENT_ALLOWED_BYTES}" (default "200MB" .Values.vmagent.allowed_bytes) -}}
{{- $data = $data | replace "HELM-NAMESPACE" .Release.Namespace -}}

# Inject the vmagent resources
{{- $vmagentResourcesMap := dict -}}
{{- if .Values.vmagent -}}
  {{- if .Values.vmagent.spec -}}
    {{- if .Values.vmagent.spec.resources -}}
      {{- $vmagentResourcesMap = .Values.vmagent.spec.resources -}}
    {{- end -}}
  {{- else if .Values.vmagent.resources -}}
    {{- $vmagentResourcesMap = .Values.vmagent.resources -}}
  {{- end -}}
{{- end -}}
{{- if $vmagentResourcesMap }}
  {{- $formattedResources := toYaml $vmagentResourcesMap | nindent 4 -}}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_RESOURCES_OBJECT: REMOVE_ME" (trimPrefix "    " (trimPrefix "\n" $formattedResources)) -}}
{{- else }}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_RESOURCES_OBJECT: REMOVE_ME" "{}" -}}
{{- end }}

# Inject extra containers
{{- $containersList := dict -}}
{{- if .Values.vmagent }}
  {{- if .Values.vmagent.spec }}
    {{- if .Values.vmagent.spec.containers }}
      {{- $containersList = .Values.vmagent.spec.containers -}}
    {{- end }}
  {{- end }}
{{- end }}
{{- if $containersList }}
  {{- $formattedContainersObject := toYaml $containersList | nindent 4 -}}
  {{- $data = $data | replace "      - name: \"${CR_VICTORIAMETRICS_ROBOTMETRICS_EXTRA_CONTAINERS_OBJECT}\"" (printf "\n%s" (trimPrefix "\n" $formattedContainersObject)) -}}
  {{- $data = $data | replace "      - name: ${CR_VICTORIAMETRICS_ROBOTMETRICS_EXTRA_CONTAINERS_OBJECT}" (printf "\n%s" (trimPrefix "\n" $formattedContainersObject)) -}}
{{- else }}
  {{- $data = $data | replace "      - name: \"${CR_VICTORIAMETRICS_ROBOTMETRICS_EXTRA_CONTAINERS_OBJECT}\"\n" "" -}}
  {{- $data = $data | replace "      - name: ${CR_VICTORIAMETRICS_ROBOTMETRICS_EXTRA_CONTAINERS_OBJECT}\n" "" -}}
{{- end }}

# Inject extra volumes
{{- $volumesList := dict -}}
{{- if .Values.vmagent }}
  {{- if .Values.vmagent.spec }}
    {{- if .Values.vmagent.spec.volumes }}
      {{- $volumesList = .Values.vmagent.spec.volumes -}}
    {{- end }}
  {{- end }}
{{- end }}
{{- if $volumesList }}
  {{- $formattedVolumesObject := toYaml $volumesList | nindent 4 -}}
  {{- $data = $data | replace "      - name: \"${CR_VICTORIAMETRICS_ROBOTMETRICS_EXTRA_VOLUMES_OBJECT}\"" (printf "\n%s" (trimPrefix "\n" $formattedVolumesObject)) -}}
  {{- $data = $data | replace "      - name: ${CR_VICTORIAMETRICS_ROBOTMETRICS_EXTRA_VOLUMES_OBJECT}" (printf "\n%s" (trimPrefix "\n" $formattedVolumesObject)) -}}
{{- else }}
  {{- $data = $data | replace "      - name: \"${CR_VICTORIAMETRICS_ROBOTMETRICS_EXTRA_VOLUMES_OBJECT}\"\n" "" -}}
  {{- $data = $data | replace "      - name: ${CR_VICTORIAMETRICS_ROBOTMETRICS_EXTRA_VOLUMES_OBJECT}\n" "" -}}
{{- end }}

# Inject extra volumeMounts
{{- $volumeMountsList := dict -}}
{{- if .Values.vmagent }}
  {{- if .Values.vmagent.spec }}
    {{- if .Values.vmagent.spec.volumeMounts }}
      {{- $volumeMountsList = .Values.vmagent.spec.volumeMounts -}}
    {{- end }}
  {{- end }}
{{- end }}
{{- if $volumeMountsList }}
  {{- $formattedVolumeMountsObject := toYaml $volumeMountsList | nindent 4 -}}
  {{- $data = $data | replace "      - name: \"${CR_VICTORIAMETRICS_ROBOTMETRICS_EXTRA_VOLUME_MOUNTS_OBJECT}\"" (printf "\n%s" (trimPrefix "\n" $formattedVolumeMountsObject)) -}}
  {{- $data = $data | replace "      - name: ${CR_VICTORIAMETRICS_ROBOTMETRICS_EXTRA_VOLUME_MOUNTS_OBJECT}" (printf "\n%s" (trimPrefix "\n" $formattedVolumeMountsObject)) -}}
{{- else }}
  {{- $data = $data | replace "      - name: \"${CR_VICTORIAMETRICS_ROBOTMETRICS_EXTRA_VOLUME_MOUNTS_OBJECT}\"\n" "" -}}
  {{- $data = $data | replace "      - name: ${CR_VICTORIAMETRICS_ROBOTMETRICS_EXTRA_VOLUME_MOUNTS_OBJECT}\n" "" -}}
{{- end }}

# Inject externalLabels
{{- $externalLabelsMap := dict -}}
{{- if .Values.vmagent }}
  {{- if .Values.vmagent.spec }}
    {{- if .Values.vmagent.spec.externalLabels }}
      {{- $externalLabelsMap = .Values.vmagent.spec.externalLabels -}}
    {{- end }}
  {{- end }}
{{- end }}
{{- if $externalLabelsMap }}
  {{- $formattedExternalLabelsObject := toYaml $externalLabelsMap | nindent 4 -}}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_ROBOTMETRICS_EXTERNAL_LABELS_OBJECT: REMOVE_ME" (trimPrefix "    " (trimPrefix "\n" $formattedExternalLabelsObject)) -}}
{{- else }}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_ROBOTMETRICS_EXTERNAL_LABELS_OBJECT: REMOVE_ME" "{}" -}}
{{- end }}

# Inject the nodeSelector and tolerations for vmagent
{{- $vmagentNodeSelectorMap := dict -}}
{{- if .Values.vmagent -}}
  {{- if .Values.vmagent.spec -}}
    {{- if .Values.vmagent.spec.nodeSelector -}}
      {{- $vmagentNodeSelectorMap = .Values.vmagent.spec.nodeSelector -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if $vmagentNodeSelectorMap }}
  {{- $formattedNodeSelector := toYaml $vmagentNodeSelectorMap | nindent 4 -}}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_NODE_SELECTOR_OBJECT: REMOVE_ME" (trimPrefix "    " (trimPrefix "\n" $formattedNodeSelector)) -}}
{{- else }}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_NODE_SELECTOR_OBJECT: REMOVE_ME" "{}" -}}
{{- end }}

{{- $vmagentTolerationsList := list -}}
{{- if .Values.vmagent -}}
  {{- if .Values.vmagent.spec -}}
    {{- if .Values.vmagent.spec.tolerations -}}
      {{- $vmagentTolerationsList = .Values.vmagent.spec.tolerations -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if $vmagentTolerationsList }}
  {{- $formattedTolerations := toYaml $vmagentTolerationsList | nindent 2 -}}
  {{- $data = $data | replace "- $CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_TOLERATIONS_OBJECT: REMOVE_ME" (trimPrefix "  " (trimPrefix "\n" $formattedTolerations)) -}}
{{- else }}
  {{- $data = $data | replace "  tolerations:\n  - $CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_TOLERATIONS_OBJECT: REMOVE_ME\n" "" -}}
{{- end }}

# Inject serviceScrapeSelector for vmagent
{{- $serviceScrapeSelectorMap := dict -}}
{{- if .Values.vmagent -}}
  {{- if .Values.vmagent.spec -}}
    {{- if .Values.vmagent.spec.serviceScrapeSelector -}}
      {{- $serviceScrapeSelectorMap = .Values.vmagent.spec.serviceScrapeSelector -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if $serviceScrapeSelectorMap }}
  {{- $formattedSelector := toYaml $serviceScrapeSelectorMap | nindent 4 -}}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_ROBOTMETRICS_SERVICE_SCRAPE_SELECTOR_OBJECT: REMOVE_ME" (trimPrefix "    " (trimPrefix "\n" $formattedSelector)) -}}
{{- else }}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_ROBOTMETRICS_SERVICE_SCRAPE_SELECTOR_OBJECT: REMOVE_ME" "{}" -}}
{{- end }}

# Inject podScrapeSelector for vmagent
{{- $podScrapeSelectorMap := dict -}}
{{- if .Values.vmagent -}}
  {{- if .Values.vmagent.spec -}}
    {{- if .Values.vmagent.spec.podScrapeSelector -}}
      {{- $podScrapeSelectorMap = .Values.vmagent.spec.podScrapeSelector -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if $podScrapeSelectorMap }}
  {{- $formattedSelector := toYaml $podScrapeSelectorMap | nindent 4 -}}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_ROBOTMETRICS_POD_SCRAPE_SELECTOR_OBJECT: REMOVE_ME" (trimPrefix "    " (trimPrefix "\n" $formattedSelector)) -}}
{{- else }}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_ROBOTMETRICS_POD_SCRAPE_SELECTOR_OBJECT: REMOVE_ME" "{}" -}}
{{- end }}

# Inject remoteWrite
{{- $remoteWriteList := dict -}}
{{- if .Values.vmagent }}
  {{- if .Values.vmagent.additionalRemoteWrites }}
    {{- $remoteWriteList = .Values.vmagent.additionalRemoteWrites -}}
  {{- end }}
{{- end }}
{{- if $remoteWriteList }}
  {{- $formattedRemoteWriteObject := toYaml $remoteWriteList | nindent 2 -}}
  {{- $data = $data | replace "  - url: \"${CR_VICTORIAMETRICS_ROBOTMETRICS_ADDITIONAL_REMOTE_WRITES_OBJECT}\"" (printf "\n%s" (trimPrefix "\n" $formattedRemoteWriteObject)) -}}
  {{- $data = $data | replace "  - url: ${CR_VICTORIAMETRICS_ROBOTMETRICS_ADDITIONAL_REMOTE_WRITES_OBJECT}" (printf "\n%s" (trimPrefix "\n" $formattedRemoteWriteObject)) -}}
{{- else }}
  {{- $data = $data | replace "  - url: \"${CR_VICTORIAMETRICS_ROBOTMETRICS_ADDITIONAL_REMOTE_WRITES_OBJECT}\"\n" "" -}}
  {{- $data = $data | replace "  - url: ${CR_VICTORIAMETRICS_ROBOTMETRICS_ADDITIONAL_REMOTE_WRITES_OBJECT}\n" "" -}}
{{- end }}

{{- /* Filter out prometheus-node-exporter resources if disabled */ -}}
{{- $nodeExporterEnabled := true }}
{{- if (index .Values "prometheus-node-exporter") }}
  {{- if hasKey (index .Values "prometheus-node-exporter") "enabled" }}
    {{- $nodeExporterEnabled = index (index .Values "prometheus-node-exporter") "enabled" }}
  {{- end }}
{{- end }}
{{- $parts := splitList "\n---\n# Source: " (printf "\n%s" $data) -}}
{{- $newData := "" -}}
{{- range $part := $parts -}}
{{- if (trim $part) }}
{{- if not (and (not $nodeExporterEnabled) (contains "app.kubernetes.io/name: prometheus-node-exporter" $part)) }}
{{- $newData = printf "%s\n---\n# Source: %s" $newData ($part | replace "toUpper" "upper") -}}
{{- end }}
{{- end }}
{{- end }}
{{- $data = trimPrefix "\n" $newData -}}

{{- $data = $data | replace "HELM-NAMESPACE" .Release.Namespace -}}

{{- if .Values.extraObjects }}
{{- range .Values.extraObjects }}
---
{{ toYaml . }}
{{- end }}
{{- end }}
