{{- end }}

{{- /* Filter out prometheus-node-exporter resources if disabled */ -}}
{{- $nodeExporterEnabled := true }}
{{- if (index .Values "prometheus-node-exporter") }}
  {{- if hasKey (index .Values "prometheus-node-exporter") "enabled" }}
    {{- $nodeExporterEnabled = index (index .Values "prometheus-node-exporter") "enabled" }}
  {{- end }}
{{- end }}
{{- $parts := splitList "\n---\n# Source: " (printf "\n%s" $data) -}}
{{- $newData := "" -}}
{{- range $part := $parts -}}
{{- if (trim $part) }}
{{- if not (and (not $nodeExporterEnabled) (contains "app.kubernetes.io/name: prometheus-node-exporter" $part)) }}
{{- $newData = printf "%s\n---\n# Source: %s" $newData ($part | replace "toUpper" "upper") -}}
{{- end }}
{{- end }}
{{- end }}
{{- $data = trimPrefix "\n" $newData -}}

{{- $data = $data | replace "HELM-NAMESPACE" .Release.Namespace -}}

# Inject extraArgs for prometheus-node-exporter
{{- $nodeExporterExtraArgsList := list -}}
{{- if index .Values "prometheus-node-exporter" -}}
  {{- if index (index .Values "prometheus-node-exporter") "extraArgs" -}}
    {{- $nodeExporterExtraArgsList = index (index .Values "prometheus-node-exporter") "extraArgs" -}}
  {{- end -}}
{{- end -}}
{{- if $nodeExporterExtraArgsList }}
  {{- $formattedExtraArgs := toYaml $nodeExporterExtraArgsList | nindent 4 -}}
  {{- $data = $data | replace "- $CR_VICTORIAMETRICS_ROBOTMETRICS_NODE_EXPORTER_EXTRA_ARGS_OBJECT: REMOVE_ME" (trimPrefix "    " (trimPrefix "\n" $formattedExtraArgs)) -}}
{{- else }}
  {{- $data = $data | replace "    - $CR_VICTORIAMETRICS_ROBOTMETRICS_NODE_EXPORTER_EXTRA_ARGS_OBJECT: REMOVE_ME\n" "" -}}
  {{- $data = $data | replace "    - $CR_VICTORIAMETRICS_ROBOTMETRICS_NODE_EXPORTER_EXTRA_ARGS_OBJECT: REMOVE_ME" "" -}}
{{- end }}

{{- if .Values.extraObjects }}
  {{- $formattedExtraObjects := "" -}}
  {{- range $index, $obj := .Values.extraObjects -}}
    {{- if $index -}}
      {{- $formattedExtraObjects = printf "%s\n---\n%s" $formattedExtraObjects (toYaml $obj | nindent 0) -}}
    {{- else -}}
      {{- $formattedExtraObjects = toYaml $obj | nindent 0 -}}
    {{- end -}}
  {{- end -}}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_ROBOTMETRICS_EXTRA_OBJECTS: REMOVE_ME" (trimPrefix "\n" $formattedExtraObjects) -}}
{{- else }}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_ROBOTMETRICS_EXTRA_OBJECTS: REMOVE_ME\n" "" -}}
  {{- $data = $data | replace "$CR_VICTORIAMETRICS_ROBOTMETRICS_EXTRA_OBJECTS: REMOVE_ME" "" -}}
{{- end }}

---
{{/* Emit rendered VM components */}}
{{ $data }}
