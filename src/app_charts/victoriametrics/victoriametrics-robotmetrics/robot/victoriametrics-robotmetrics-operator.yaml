# This includes all resources expanded from the victoria-metrics-k8s-stack chart using
# the values in ../victoriametrics-robotmetrics-robot.values.yaml for the robot edge target.
# Some pseudo-variables that were inserted there are replaced with actual runtime values.
{{- $data := .Files.Get "files/victoriametrics-robotmetrics-chart.robot.yaml" -}}

# Scalar Replacements
{{- $data = $data | replace "${RELEASE_NAME}" .Release.Name -}}
{{- $data = $data | replace "${VMAGENT_TMP_DATA_PATH}" (default "/tmp/vmagent-remotewrite-data" .Values.vmagent.tmp_data_path) -}}
{{- $data = $data | replace "${VMAGENT_MAX_DISK_USAGE}" (default "5GB" .Values.vmagent.max_disk_usage) -}}
{{- $data = $data | replace "${VMAGENT_ALLOWED_BYTES}" (default "200MB" .Values.vmagent.allowed_bytes) -}}
{{- $data = $data | replace "HELM-NAMESPACE" .Release.Namespace -}}

# Inject the vmagent resources
{{- $vmagentResourcesMap := dict -}}
{{- if .Values.vmagent -}}
  {{- if .Values.vmagent.spec -}}
    {{- if .Values.vmagent.spec.resources -}}
      {{- $vmagentResourcesMap = .Values.vmagent.spec.resources -}}
    {{- end -}}
  {{- else if .Values.vmagent.resources -}}
    {{- $vmagentResourcesMap = .Values.vmagent.resources -}}
  {{- end -}}
{{- end -}}
{{- if $vmagentResourcesMap }}
  {{- $formattedResources := toYaml $vmagentResourcesMap | nindent 6 -}}
  {{- $data = $data | replace "${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_RESOURCES_OBJECT}" (printf "\n%s" $formattedResources) -}}
{{- else }}
  {{- $data = $data | replace "    resources: ${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_RESOURCES_OBJECT}\n" "" -}}
{{- end }}

# Inject extra containers
{{- $containersList := dict -}}
{{- if .Values.vmagent }}
  {{- if .Values.vmagent.spec }}
    {{- if .Values.vmagent.spec.containers }}
      {{- $containersList = .Values.vmagent.spec.containers -}}
    {{- end }}
  {{- end }}
{{- end }}
{{- if $containersList }}
  {{- $formattedContainersObject := toYaml $containersList | nindent 4 -}}
  {{- $data = $data | replace "- name: ${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_CONTAINERS_OBJECT}" $formattedContainersObject -}}
{{- else }}
  {{- $data = $data | replace "    containers:\n      - name: ${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_CONTAINERS_OBJECT}\n" "" -}}
{{- end }}

# Inject extra volumes
{{- $volumesList := dict -}}
{{- if .Values.vmagent }}
  {{- if .Values.vmagent.spec }}
    {{- if .Values.vmagent.spec.volumes }}
      {{- $volumesList = .Values.vmagent.spec.volumes -}}
    {{- end }}
  {{- end }}
{{- end }}
{{- if $volumesList }}
  {{- $formattedVolumesObject := toYaml $volumesList | nindent 4 -}}
  {{- $data = $data | replace "- name: ${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_VOLUMES_OBJECT}" $formattedVolumesObject -}}
{{- else }}
  {{- $data = $data | replace "    volumes:\n      - name: ${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_VOLUMES_OBJECT}\n" "" -}}
{{- end }}

# Inject extra volumeMounts
{{- $volumeMountsList := dict -}}
{{- if .Values.vmagent }}
  {{- if .Values.vmagent.spec }}
    {{- if .Values.vmagent.spec.volumeMounts }}
      {{- $volumeMountsList = .Values.vmagent.spec.volumeMounts -}}
    {{- end }}
  {{- end }}
{{- end }}
{{- if $volumeMountsList }}
  {{- $formattedVolumeMountsObject := toYaml $volumeMountsList | nindent 4 -}}
  {{- $data = $data | replace "- name: ${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_VOLUME_MOUNTS_OBJECT}" $formattedVolumeMountsObject -}}
{{- else }}
  {{- $data = $data | replace "    volumeMounts:\n      - name: ${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_EXTRA_VOLUME_MOUNTS_OBJECT}\n" "" -}}
{{- end }}

# Inject externalLabels
{{- $externalLabelsMap := dict -}}
{{- if .Values.vmagent }}
  {{- if .Values.vmagent.spec }}
    {{- if .Values.vmagent.spec.externalLabels }}
      {{- $externalLabelsMap = .Values.vmagent.spec.externalLabels -}}
    {{- end }}
  {{- end }}
{{- end }}
{{- if $externalLabelsMap }}
  {{- $formattedExternalLabelsObject := toYaml $externalLabelsMap | nindent 6 -}}
  {{- $data = $data | replace "    externalLabels: ${CR_VICTORIAMETRICS_ROBOTMETRICS_EXTERNAL_LABELS_OBJECT}" (printf "    externalLabels:%s" $formattedExternalLabelsObject) -}}
{{- else }}
  {{- $data = $data | replace "    externalLabels: ${CR_VICTORIAMETRICS_ROBOTMETRICS_EXTERNAL_LABELS_OBJECT}\n" "" -}}
{{- end }}

# Inject the nodeSelector and tolerations for vmagent
{{- $vmagentNodeSelectorMap := dict -}}
{{- if .Values.vmagent -}}
  {{- if .Values.vmagent.spec -}}
    {{- if .Values.vmagent.spec.nodeSelector -}}
      {{- $vmagentNodeSelectorMap = .Values.vmagent.spec.nodeSelector -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if $vmagentNodeSelectorMap }}
  {{- $formattedNodeSelector := toYaml $vmagentNodeSelectorMap | nindent 4 -}}
  {{- $data = $data | replace "${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_NODE_SELECTOR_OBJECT}" $formattedNodeSelector -}}
{{- else }}
  {{- $data = $data | replace "    nodeSelector: ${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_NODE_SELECTOR_OBJECT}\n" "" -}}
{{- end }}

{{- $vmagentTolerationsList := list -}}
{{- if .Values.vmagent -}}
  {{- if .Values.vmagent.spec -}}
    {{- if .Values.vmagent.spec.tolerations -}}
      {{- $vmagentTolerationsList = .Values.vmagent.spec.tolerations -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if $vmagentTolerationsList }}
  {{- $formattedTolerations := toYaml $vmagentTolerationsList | nindent 4 -}}
  {{- $data = $data | replace "${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_TOLERATIONS_OBJECT}" $formattedTolerations -}}
{{- else }}
  {{- $data = $data | replace "    tolerations: ${CR_VICTORIAMETRICS_ROBOTMETRICS_VMAGENT_TOLERATIONS_OBJECT}\n" "" -}}
{{- end }}

# Inject serviceMonitorSelector for vmagent
{{- $serviceMonitorSelectorMap := dict -}}
{{- if .Values.vmagent -}}
  {{- if .Values.vmagent.spec -}}
    {{- if .Values.vmagent.spec.serviceMonitorSelector -}}
      {{- $serviceMonitorSelectorMap = .Values.vmagent.spec.serviceMonitorSelector -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if $serviceMonitorSelectorMap }}
  {{- $formattedSelector := toYaml $serviceMonitorSelectorMap | nindent 4 -}}
  {{- $data = $data | replace "${CR_VICTORIAMETRICS_ROBOTMETRICS_SERVICE_MONITOR_SELECTOR_OBJECT}" $formattedSelector -}}
{{- else }}
  {{- $data = $data | replace "    serviceMonitorSelector: ${CR_VICTORIAMETRICS_ROBOTMETRICS_SERVICE_MONITOR_SELECTOR_OBJECT}\n" "" -}}
{{- end }}

# Inject podMonitorSelector for vmagent
{{- $podMonitorSelectorMap := dict -}}
{{- if .Values.vmagent -}}
  {{- if .Values.vmagent.spec -}}
    {{- if .Values.vmagent.spec.podMonitorSelector -}}
      {{- $podMonitorSelectorMap = .Values.vmagent.spec.podMonitorSelector -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if $podMonitorSelectorMap }}
  {{- $formattedSelector := toYaml $podMonitorSelectorMap | nindent 4 -}}
  {{- $data = $data | replace "${CR_VICTORIAMETRICS_ROBOTMETRICS_POD_MONITOR_SELECTOR_OBJECT}" $formattedSelector -}}
{{- else }}
  {{- $data = $data | replace "    podMonitorSelector: ${CR_VICTORIAMETRICS_ROBOTMETRICS_POD_MONITOR_SELECTOR_OBJECT}\n" "" -}}
{{- end }}

# Inject remoteWrite
{{- $remoteWriteList := dict -}}
{{- if .Values.vmagent }}
  {{- if .Values.vmagent.spec }}
    {{- if .Values.vmagent.spec.remoteWrite }}
      {{- $remoteWriteList = .Values.vmagent.spec.remoteWrite -}}
    {{- end }}
  {{- end }}
{{- end }}
{{- if $remoteWriteList }}
  {{- $formattedRemoteWriteObject := toYaml $remoteWriteList | nindent 2 -}}
  {{- $data = $data | replace "  - url: ${CR_VICTORIAMETRICS_ROBOTMETRICS_REMOTE_WRITE_OBJECT}" (printf "\n%s" (trimPrefix "\n" $formattedRemoteWriteObject)) -}}
{{- else }}
  {{- $data = $data | replace "  - url: ${CR_VICTORIAMETRICS_ROBOTMETRICS_REMOTE_WRITE_OBJECT}\n" "" -}}
{{- end }}

{{ $data | replace "toUpper" "upper" }}

{{- if .Values.extraObjects }}
{{- range .Values.extraObjects }}
---
{{ toYaml . }}
{{- end }}
{{- end }}
