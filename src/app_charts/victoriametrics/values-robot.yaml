# Project-wide kill switch for robot-side VictoriaMetrics (vmagent, node-exporter,
# smartctl-exporter). Distinct from the per-robot AppRollout selector
# (cloudrobotics.com/enable-victoriametrics label) - this gate applies AFTER a
# robot is already selected, letting the whole robot-side VM stack be turned off
# project-wide without touching the selector. Defaults true - matches existing
# behavior, no silent disable of any currently-deployed robot.
enable_robot_victoriametrics: true

# App-chart-level values consumed by robot/vmagent-operator.yaml's
# pseudo-variable replace chain.
#
# Must be set per deployment under AppRollout spec.robots[].values.
vm_remote_write_url: ""

# Optional upstream integration for an external metrics consumer. Sidecar fields
# are raw YAML blocks for injecting an authorization sidecar into robot vmagent;
# metrics fields add a second remote_write target with its own relabel filter.
# remote_write_labels is a raw multi-line block of
# "- -remoteWrite.label=key=value" style lines.
# Empty by default, no effect on existing projects.
upstream:
  sidecar_containers: ""
  sidecar_volumes: ""
  sidecar_volume_mounts: ""
  remote_write_labels: ""
  metrics_url: ""
  metrics_relabel_config: ""
