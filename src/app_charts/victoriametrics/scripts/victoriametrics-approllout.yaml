# Simple, single-project AppRollout for testing the VictoriaMetrics
# app chart against xfa-awesome-alpha's cloud-robotics cluster.
#
# This is intentionally hardcoded/simple, not a production-grade
# per-project templated version (see Prometheus's rollout.yaml for
# that level of complexity) - matches the internship deliverable scope
# of a single-project drop-in replacement, per Stefan Sauer's guidance.

apiVersion: apps.cloudrobotics.com/v1alpha1
kind: AppRollout
metadata:
  name: victoriametrics
  labels:
    app: victoriametrics
spec:
  appName: victoriametrics-dev
  cloud:
    values:
      limits:
        cpu: "2000m"
        memory: "12Gi"
      requests:
        storage: "100Gi"
      retention:
        time: "90d"
      # prom-proxy / auth-proxy configuration, mirroring Prometheus's
      # pattern for consistency
      prom_external_url: "https://flowstate.intrinsic.ai/_p/xfa-awesome-alpha/victoriametrics"
      prom_ingress_auth_url: "http://frontend.app-frontend.svc.cluster.local/auth-proxy/authorize?scopes=internal"
      prom_ingress_auth_signin: "https://flowstate.intrinsic.ai/signin?redirectUrl=https%3A%2F%2Fflowstate.intrinsic.ai%2F_p%2Fxfa-awesome-alpha$escaped_request_uri"
      prom_ingress_error_page_403: "https://flowstate.intrinsic.ai/signin?redirectUrl=https%3A%2F%2Fflowstate.intrinsic.ai%2F_p%2Fxfa-awesome-alpha$escaped_request_uri"
  robots:
    - values:
        # Per Aqualine + network topology doc review (July 9, 2026): on-prem
        # outbound traffic goes through Aqualine, authenticated as the robot's
        # GCP service account for the TUNNEL layer. Separately, at the APP
        # layer, this must go through a DEDICATED write ingress path
        # (cloud/vm-write-ingress.yaml) using the auth-proxy's apikey scope,
        # since the browser-oriented "internal" auth scope used by the human
        # query path (vm-ingress.yaml) cannot be completed by a non-interactive
        # client like vmagent. Confirmed working directly against the live
        # cluster on July 17, 2026 (curl test reached vminsert successfully
        # past the auth-proxy using an API key).
        vm_remote_write_url: "https://www.endpoints.xfa-awesome-alpha.cloud.goog/victoriametrics-write/insert/0/prometheus/api/v1/write"
      selector:
        matchExpressions:
          # Only target robots that have explicitly opted in to
          # VictoriaMetrics, keeping every other robot untouched and
          # still on the existing Prometheus AppRollout. This mirrors
          # the same label-based mechanism Prometheus's own AppRollout
          # uses (cloudrobotics.com/disable-prometheus) to ensure each
          # robot runs exactly one collector path at a time.
          - key: cloudrobotics.com/enable-victoriametrics
            operator: Exists
          - key: intrinsic.ai/created-by-test
            operator: DoesNotExist
