enable_cloud_robot_victoriametrics: true

# App-chart-level values consumed by cloud/victoriametrics-operator.yaml
# and cloud/grafana-operator.yaml's pseudo-variable replace chains.
# Mirrors src/app_charts/prometheus/values-cloud.yaml's pattern.
#
# The default requests/limits are sufficient for a small test
# deployment (single project, testing scope). Should be revisited for
# any larger/production rollout.
limits:
  cpu: "2000m"
  memory: "12Gi"
requests:
  storage: "100Gi"
retention:
  time: "90d"
vminsert_port: 8480
vmselect_port: 8481

gf_server_domain: "flowstate.intrinsic.ai"
gf_server_root_url: "https://flowstate.intrinsic.ai/_p/xfa-awesome-alpha/vm-grafana"
gf_csrf_trusted_origins: "flowstate.intrinsic.ai"
gf_smtp_enabled: "false"
gf_smtp_host: ""
gf_smtp_user: ""
gf_smtp_password: ""
gf_smtp_from_address: ""
gf_smtp_from_name: ""
gf_smtp_skip_verify: "true"

# Query endpoint for Grafana's VictoriaMetrics datasource - the direct
# backend project endpoint (www.endpoints.<project>.cloud.goog), not
# the Portal proxy path, per network topology doc review.
vm_query_url: "https://www.endpoints.xfa-awesome-alpha.cloud.goog/victoriametrics"

prom_ingress_auth_url: "http://frontend.app-frontend.svc.cluster.local/auth-proxy/authorize?scopes=internal"
prom_ingress_auth_signin: "https://flowstate.intrinsic.ai/signin?redirectUrl=https%3A%2F%2Fflowstate.intrinsic.ai%2F_p%2Fxfa-awesome-alpha$escaped_request_uri"
prom_ingress_error_page_403: "https://flowstate.intrinsic.ai/signin?redirectUrl=https%3A%2F%2Fflowstate.intrinsic.ai%2F_p%2Fxfa-awesome-alpha$escaped_request_uri"

gf_ingress_auth_url: "http://frontend.app-frontend.svc.cluster.local/auth-proxy/authorize?scopes=internal"
gf_ingress_auth_signin: "https://flowstate.intrinsic.ai/signin?redirectUrl=https%3A%2F%2Fflowstate.intrinsic.ai%2F_p%2Fxfa-awesome-alpha$escaped_request_uri"
gf_ingress_error_page_403: "https://flowstate.intrinsic.ai/signin?redirectUrl=https%3A%2F%2Fflowstate.intrinsic.ai%2F_p%2Fxfa-awesome-alpha$escaped_request_uri"
