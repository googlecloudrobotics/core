# Configuration for the victoria-metrics-agent chart (vmagent).
# Pinned to chart version 0.6.0 (predates the victoria-metrics-common
# shared dependency, which introduces a templated probe pattern
# incompatible with CRC's hermetic Helm 3.9.0 helm_template rule -
# see technical log for details). Revisit this pin if CRC's pinned
# Helm binary is ever upgraded to 3.14+.
#
# WARNING: If you edit this file, run the following command to generate
# the output with `helm template`, and verify that your changes have
# the expected effect.
#
#   bazel build src/app_charts/victoriametrics-robotmetrics/vmagent-chart.robot.yaml

remoteWriteUrls:
  - "${VM_REMOTE_WRITE_URL}"

rbac:
  pspEnabled: false

extraArgs:
  # On-prem outbound traffic goes through Aqualine, whose local client
  # side is exposed at a fixed IP:port on every on-prem cluster (per
  # google3/intrinsic/kubernetes/intrinsic_os/g3doc/aqualine.md) -
  # confirmed real and correct directly against lab-mtv-400 on July 17.
  remoteWrite.proxyURL: "http://172.28.0.8:1212"

# The remote_write endpoint requires machine-to-machine auth via the
# auth-proxy's apikey scope (see cloud/vm-write-ingress.yaml), since
# the browser-oriented internal scope can't be completed by a
# non-interactive client. Bearer token supplied via env var, which
# vmagent maps to -remoteWrite.bearerToken via its envflag mechanism
# (envflag.enable=true, envflag.prefix=VM_, already set in extraArgs).
env:
  - name: VM_remoteWrite_bearerToken
    valueFrom:
      secretKeyRef:
        name: vm-remote-write-apikey
        key: token

config:
  global:
    scrape_interval: 30s
  scrape_configs:
    - job_name: node-exporter
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          regex: node-exporter
          action: keep
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: instance
      metric_relabel_configs:
        - source_labels: [__name__]
          regex: "node_cpu_seconds_total"
          action: drop
    - job_name: smartctl-exporter
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          regex: smartctl-exporter
          action: keep
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: instance
        - source_labels: [__address__]
          regex: '(.*)'
          target_label: __address__
          replacement: '${1}:9633'
