{{- if eq .Values.use_gateway "true" }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: crc-gateway-proxy-config
  namespace: envoy-gateway-system
spec:
  concurrency: 2
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local
        loadBalancerIP: {{ .Values.ingress_ip }}
      envoyHpa:
        minReplicas: 2
        maxReplicas: 5
        metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 80
      envoyDeployment:
        replicas: 2
        pod:
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: envoy
                  topologyKey: kubernetes.io/hostname
        container:
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
  shutdown:
    drainTimeout: 60s
    minDrainDuration: 15s
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: crc-gateway-proxy-config
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: crc-gateway
spec:
  gatewayClassName: eg
  allowedListeners:
    namespaces:
      from: Selector
      selector:
        matchLabels:
          crc-gateway-allow-listenerset: "true"
  listeners:
  - name: http
    # hostname: {{ .Values.domain }} # Uncomment to restrict this listener to the configured domain. Required if multiple Gateways share the same IP.
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
  - name: https
    # hostname: {{ .Values.domain }} # Uncomment to restrict this listener to the configured domain. Required if multiple Gateways share the same IP (via SNI).
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: tls
        kind: Secret
    allowedRoutes:
      namespaces:
        from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
spec:
  parentRefs:
  - name: crc-gateway
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: crc-gateway-client-traffic-policy
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: crc-gateway
  tls:
    minVersion: "1.2"
    alpnProtocols:
    - h2
    - http/1.1
  # Client-to-Envoy Traffic Policy:
  # - 5 MiB stream window / 8 MiB connection window & buffer limit allows high-RTT
  #   uploads (e.g. 130 ms RTT) to reach ~38.5 MB/s (~308 Mbit/s) per stream while bounding
  #   worst-case memory per stalled connection to 8 MiB (capped by Envoy's overload_manager
  #   at 80% of the 4 GiB pod memory limit).
  # - Omitting streamIdleTimeout keeps Envoy's 300s listener default while allowing
  #   Envoy Gateway's translator to auto-scale per-route idleTimeout when HTTPRoute.timeouts
  #   exceeds 300s.
  connection:
    bufferLimit: 8Mi
  http2:
    maxConcurrentStreams: 100
    initialStreamWindowSize: 5242880      # 5 MiB
    initialConnectionWindowSize: 8388608  # 8 MiB
    connectionKeepalive:
      idleInterval: 60s
      interval: 60s                       # Sends periodic HTTP/2 PING frames to prevent L4 load balancer 600s idle drops
      timeout: 15s
---
# Default Gateway BackendTrafficPolicy:
# - Matches NGINX's 60s default timeout for standard unary RPCs and web APIs.
# - 1 MiB stream window / 4 MiB connection window & buffer limit matches in-cluster
#   backend gRPC defaults (1 MiB chunk < 1 MiB stream < 4 MiB conn = 4 MiB buffer).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: crc-gateway-backend-traffic-policy
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: crc-gateway
  connection:
    bufferLimit: 4Mi
  http2:
    initialStreamWindowSize: 1048576      # 1 MiB (overrides 64 KiB default to prevent 16x WINDOW_UPDATE stalls on 1 MiB chunks)
    initialConnectionWindowSize: 4194304  # 4 MiB
    connectionKeepalive:
      idleInterval: 60s
      interval: 60s
      timeout: 15s
  timeout:
    http:
      requestTimeout: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy-metrics
  namespace: envoy-gateway-system
  labels:
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: instance
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy-gateway-metrics
  namespace: envoy-gateway-system
  labels:
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      control-plane: envoy-gateway
  endpoints:
    - port: metrics
      path: /metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-dashboards-json
  namespace: envoy-gateway-system
  labels:
    grafana: "1"
data:
  envoy-proxy-global.json: |-
{{ .Files.Get "files/envoy-proxy-global.json" | indent 4 }}
  envoy-gateway-global.json: |-
{{ .Files.Get "files/envoy-gateway-global.json" | indent 4 }}
  envoy-clusters.json: |-
{{ .Files.Get "files/envoy-clusters.json" | indent 4 }}
{{- end }}


