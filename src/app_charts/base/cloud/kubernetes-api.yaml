{{- if eq .Values.onprem_federation "true" }}
# Legacy NGINX Ingress: Uses subrequest authentication via /auth.
# NGINX replaces the Authorization header with the subrequest response header.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernetes-api
  annotations:
    nginx.ingress.kubernetes.io/auth-url: http://cr-syncer-auth-webhook.default.svc.cluster.local/auth
    nginx.ingress.kubernetes.io/auth-response-headers: Authorization
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"  # seconds
    nginx.ingress.kubernetes.io/client-body-buffer-size: "50m"
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.domain }}
    http:
      paths:
      - path: /apis/core.kubernetes($|/)(.*)
        pathType: Prefix
        backend:
          service:
            name: kubernetes
            port:
              number: 443
---
# Gateway API (Envoy Gateway): Routes /apis/core.kubernetes/ directly to cr-syncer-auth-webhook:80.
# Why: Envoy's ExtAuthz filter appends headers by default, causing duplicate Bearer token collisions.
# Routing directly to cr-syncer-auth-webhook as an inline reverse proxy allows Go code to perform
# in-memory token replacement and stream requests to https://kubernetes.default.svc:443 cleanly.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubernetes-api
spec:
  hostnames:
  - {{ .Values.domain }}
  parentRefs:
  - name: crc-gateway
    namespace: default
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /apis/core.kubernetes/
    timeouts:
      backendRequest: 600s
    backendRefs:
    - name: cr-syncer-auth-webhook
      port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: kubernetes-api-allow
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: kubernetes-api
  authorization:
    defaultAction: Allow
{{- end }}
