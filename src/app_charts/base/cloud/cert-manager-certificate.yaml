apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: selfsigned-ca
spec:
  isCA: true
  duration: 8760h  # 1year. This needs to be at least 3x 90days
  commonName: {{ .Values.domain }}
  secretName: cluster-authority
  privateKey:
    algorithm: ECDSA
    size: 256
    # Keep the CA key stable on renewal so that certificates it has already
    # signed (e.g. webhook serving certs) remain valid. cert-manager >= v1.18
    # defaults to Always.
    rotationPolicy: Never
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cloud-robotics
spec:
  commonName: {{ .Values.domain }}
  secretName: tls
  dnsNames:
    - {{ .Values.domain }}
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
