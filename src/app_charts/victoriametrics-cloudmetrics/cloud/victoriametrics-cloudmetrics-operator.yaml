# This includes all resources expanded from the second victoria-metrics-cluster
# chart using the values in ../victoriametrics-cloudmetrics.values.yaml.
{{- $data := .Files.Get "files/victoriametrics-chart-cloudmetrics.cloud.yaml" -}}
{{- $data = $data | replace "${VMSTORAGE_LIMITS_MEMORY}" .Values.limits.memory | replace "${VMSTORAGE_LIMITS_CPU}" .Values.limits.cpu | replace "${REQUESTS_STORAGE}" .Values.requests.storage | replace "${RETENTION_TIME}" .Values.retention.time | replace "${VMINSERT_PORT}" (toString .Values.vminsert_port) | replace "${VMSELECT_PORT}" (toString .Values.vmselect_port) | replace "${VMINSERT_REPLICAS}" (toString .Values.vminsert_replicas) | replace "${VMSELECT_REPLICAS}" (toString .Values.vmselect_replicas) | replace "HELM-NAMESPACE" .Release.Namespace -}}
{{ $data }}
