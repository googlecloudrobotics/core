# Simple, single-project AppRollout for testing the VictoriaMetrics
# cloud-metrics app chart against xfa-awesome-alpha's cloud-robotics cluster.
#
# This is intentionally hardcoded/simple, not a production-grade
# per-project templated version (see Prometheus's rollout.yaml for
# that level of complexity) - matches the internship deliverable scope
# of a single-project drop-in replacement, per Stefan Sauer's guidance.

apiVersion: apps.cloudrobotics.com/v1alpha1
kind: AppRollout
metadata:
  name: victoriametrics-cloudmetrics
  labels:
    app: victoriametrics-cloudmetrics
spec:
  appName: victoriametrics-cloudmetrics-dev
  cloud:
    values:
      limits:
        cpu: "2000m"
        memory: "12Gi"
      requests:
        storage: "100Gi"
      retention:
        time: "90d"
      # prom-proxy / auth-proxy configuration, mirroring Prometheus's
      # pattern for consistency.
      prom_ingress_auth_url: "http://frontend.app-frontend.svc.cluster.local/auth-proxy/authorize?scopes=internal"
      prom_ingress_auth_signin: "https://flowstate.intrinsic.ai/signin?redirectUrl=https%3A%2F%2Fflowstate.intrinsic.ai%2F_p%2Fxfa-awesome-alpha$escaped_request_uri"
      prom_ingress_error_page_403: "https://flowstate.intrinsic.ai/signin?redirectUrl=https%3A%2F%2Fflowstate.intrinsic.ai%2F_p%2Fxfa-awesome-alpha$escaped_request_uri"
