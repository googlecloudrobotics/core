enable_cloud_cloud_victoriametrics: true
release_name: "vmc-agent"

limits:
  cpu: "2000m"
  memory: "12Gi"
requests:
  storage: "100Gi"
retention:
  time: "90d"
vminsert_port: 8480
vmselect_port: 8481

# Optional raw YAML blocks for injecting an upstream authorization sidecar into
# the cloud vmagent Deployment. The sidecar writes credentials to a shared
# volume read automatically by vmagent, with no vmagent-side config needed
# beyond the volume mount. Empty by default, no effect on existing projects.
upstream_sidecar_containers: ""
upstream_sidecar_volumes: ""
upstream_sidecar_volume_mounts: ""

# Optional second remote_write target for an external upstream metrics consumer
# (Cloud Ops). Empty by default - no second target, existing behavior unchanged.
# When set, applies to this target only, never the local vminsert target. Generic
# naming per Cloud Ops's request.
upstream_metrics_url: ""
upstream_metrics_relabel_config: ""

prom_ingress_auth_url: "http://frontend.app-frontend.svc.cluster.local/auth-proxy/authorize?scopes=internal"
prom_ingress_auth_signin: "https://flowstate.intrinsic.ai/signin?redirectUrl=https%3A%2F%2Fflowstate.intrinsic.ai%2F_p%2Fxfa-awesome-alpha$escaped_request_uri"
prom_ingress_error_page_403: "https://flowstate.intrinsic.ai/signin?redirectUrl=https%3A%2F%2Fflowstate.intrinsic.ai%2F_p%2Fxfa-awesome-alpha$escaped_request_uri"
