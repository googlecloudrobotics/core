# Simple, single-project AppRollout for testing the standalone Grafana
# app chart against xfa-awesome-alpha's cloud-robotics cluster.
#
# This is intentionally hardcoded/simple, not a production-grade
# per-project templated version (see Prometheus's rollout.yaml for
# that level of complexity) - matches the internship deliverable scope
# of a single-project drop-in replacement.

apiVersion: apps.cloudrobotics.com/v1alpha1
kind: AppRollout
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  appName: grafana-dev
  cloud:
    values:
      gf_server_domain: "flowstate.intrinsic.ai"
      gf_server_root_url: "https://flowstate.intrinsic.ai/_p/xfa-awesome-alpha/vm-grafana"
      gf_csrf_trusted_origins: "flowstate.intrinsic.ai"
      gf_smtp_enabled: "false"
      gf_smtp_host: ""
      gf_smtp_user: ""
      gf_smtp_password: ""
      gf_smtp_from_address: ""
      gf_smtp_from_name: ""
      gf_smtp_skip_verify: "true"
      gf_ingress_auth_url: "http://frontend.app-frontend.svc.cluster.local/auth-proxy/authorize?scopes=internal"
      gf_ingress_auth_signin: "https://flowstate.intrinsic.ai/signin?redirectUrl=https%3A%2F%2Fflowstate.intrinsic.ai%2F_p%2Fxfa-awesome-alpha$escaped_request_uri"
      gf_ingress_error_page_403: "https://flowstate.intrinsic.ai/signin?redirectUrl=https%3A%2F%2Fflowstate.intrinsic.ai%2F_p%2Fxfa-awesome-alpha$escaped_request_uri"
      vm_query_url_robot: "http://vm-victoria-metrics-cluster-vmselect.app-victoriametrics.svc.cluster.local:8481/select/0/prometheus"
      vm_query_url_cloud: "http://vmc-victoria-metrics-cluster-vmselect.app-victoriametrics-cloudmetrics.svc.cluster.local:8481/select/0/prometheus"
