# This includes all resources expanded from the grafana chart using
# the values in ../grafana.cloud.values.yaml. Some pseudo-variables
# that were inserted there are replaced with actual runtime values.
# NOTE: order is important - domain and project might be part of
# other values and need to be replaced last, mirroring Prometheus's
# prometheus-operator.yaml convention.
{{- $data := .Files.Get "files/grafana-chart.cloud.yaml" -}}
{{- $data = $data | replace "${CR_GF_SERVER_DOMAIN}" .Values.gf_server_domain | replace "${CR_GF_SERVER_ROOT_URL}" .Values.gf_server_root_url | replace "${CR_GF_CSRF_TRUSTED_ORIGINS}" .Values.gf_csrf_trusted_origins | replace "${CR_GF_SMTP_ENABLED}" .Values.gf_smtp_enabled | replace "${CR_GF_SMTP_HOST}" .Values.gf_smtp_host | replace "${CR_GF_SMTP_USER}" .Values.gf_smtp_user | replace "${CR_GF_SMTP_PASSWORD}" .Values.gf_smtp_password | replace "${CR_GF_SMTP_FROM_ADDRESS}" .Values.gf_smtp_from_address | replace "${CR_GF_SMTP_FROM_NAME}" .Values.gf_smtp_from_name | replace "${CR_GF_SMTP_SKIP_VERIFY}" .Values.gf_smtp_skip_verify | replace "${VM_QUERY_URL_ROBOT}" .Values.vm_query_url_robot | replace "${VM_QUERY_URL_CLOUD}" .Values.vm_query_url_cloud | replace "HELM-NAMESPACE" .Release.Namespace -}}
{{ $data }}
