apiVersion: v1
kind: ServiceAccount
metadata:
  name: token-vendor
  annotations:
    iam.gke.io/gcp-service-account: "token-vendor@{{ .Values.project }}.iam.gserviceaccount.com"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: token-vendor-key-mngmt
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["*"]
- apiGroups: ["registry.cloudrobotics.com"]
  resources: ["robots", "robots/finalizers"]
  verbs: ["get", "list", "watch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: token-vendor-key-mngmt-binding
subjects:
- kind: ServiceAccount
  name: token-vendor
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: token-vendor-key-mngmt
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-extauth-token-vendor
spec:
  from:
  - group: gateway.envoyproxy.io
    kind: SecurityPolicy
    namespace: app-k8s-relay
  - group: gateway.envoyproxy.io
    kind: SecurityPolicy
    namespace: app-prometheus
  - group: gateway.envoyproxy.io
    kind: SecurityPolicy
    namespace: app-victoriametrics-robotmetrics
  to:
  - group: ""
    kind: Service
    name: token-vendor

