# This includes all resources expanded from the prometheus-operator chart using
# the values in ../prometheus-cloud.values.yaml.
# Some pseudo-variables that were inserted there are replaced with actual runtime values.
# TODO(rodrigoq): This severely limits how the end-user can customize the
# prometheus deployment. How could we let them override prometheus-cloud.values.yaml?
# NOTE: The order here is important. The domain and project might be part of other values and
#       need to be replaced last.
{{- $data := .Files.Get "files/prometheus-operator-chart.cloud.yaml" -}}
# Pre-process variables
{{- $data = $data | replace "${CR_PROM_INGRESS_AUTH_URL}" .Values.prom_ingress_auth_url -}}
{{- $data = $data | replace "${CR_PROM_INGRESS_AUTH_SIGNIN}" .Values.prom_ingress_auth_signin -}}
{{- $data = $data | replace "${CR_PROM_INGRESS_ERROR_PAGE_403}" .Values.prom_ingress_error_page_403 -}}
{{- $data = $data | replace "HELM-NAMESPACE" .Release.Namespace -}}
{{- $data = $data | replace "${LIMITS_MEMORY}" .Values.limits.memory -}}
{{- $data = $data | replace "${LIMITS_CPU}" .Values.limits.cpu -}}
{{- $data = $data | replace "${REQUESTS_STORAGE}" .Values.requests.storage -}}
{{- $data = $data | replace "${RETENTION_TIME}" .Values.retention.time -}}
{{- $data = $data | replace "${RETENTION_SIZE}" .Values.retention.size -}}
{{- $data = $data | replace "${EXTERNAL_URL}" .Values.prom_external_url -}}
{{- $data = $data | replace "${CLOUD_ROBOTICS_DOMAIN}" .Values.domain -}}
{{- $data = $data | replace "${GCP_PROJECT_ID}" .Values.project -}}

# Inject the nodeSelector as a pre-formatted YAML block to allow users to define multiple selectors in a dict within values-cloud.yaml while maintaining valid indentation in the output.
{{- $prometheusNodeSelectorMap := .Values.prometheus.prometheusSpec.nodeSelector -}}
{{- if $prometheusNodeSelectorMap }}
  {{- $prometheusNodeSelectorRawYaml := toYaml $prometheusNodeSelectorMap -}}
  {{- $formattedPrometheusNodeSelectorObject := $prometheusNodeSelectorRawYaml | nindent 6 -}}
  {{- $data = $data | replace "$CR_PROMETHEUS_NODE_SELECTOR_OBJECT: REMOVE_ME" $formattedPrometheusNodeSelectorObject -}}
{{- else }}
  {{- $data = $data | replace "$CR_PROMETHEUS_NODE_SELECTOR_OBJECT: REMOVE_ME" "{}" -}}
{{- end }}

# Inject the tolerations as a pre-formatted YAML block to support multiple key-value pairs in a list within values-cloud.yaml
{{- $prometheusTolerationsList := .Values.prometheus.prometheusSpec.tolerations -}}
{{- if $prometheusTolerationsList }}
  {{- $prometheusTolerationsRawYaml := toYaml $prometheusTolerationsList -}}
  {{- $formattedTolerationsObject := $prometheusTolerationsRawYaml | nindent 6 -}}
  {{- $data = $data | replace "${CR_PROMETHEUS_TOLERATIONS_OBJECT}" $formattedTolerationsObject -}}
{{- else }}
  {{- $data = $data | replace "${CR_PROMETHEUS_TOLERATIONS_OBJECT}" " []" -}}
{{- end }}


# Inject the serviceMonitorSelector and podMonitorSelector to allow users to override the universal matching default.
{{- $prometheusServiceMonitorSelectorMap := dict -}}
{{- if .Values.prometheus }}
  {{- if .Values.prometheus.prometheusSpec }}
    {{- if .Values.prometheus.prometheusSpec.serviceMonitorSelector }}
      {{- $prometheusServiceMonitorSelectorMap = .Values.prometheus.prometheusSpec.serviceMonitorSelector -}}
    {{- end }}
  {{- end }}
{{- end }}
{{- if $prometheusServiceMonitorSelectorMap }}
  {{- $formattedPrometheusServiceMonitorSelectorObject := toYaml $prometheusServiceMonitorSelectorMap | nindent 6 -}}
  {{- $data = $data | replace "$CR_PROMETHEUS_SERVICE_MONITOR_SELECTOR_OBJECT: REMOVE_ME" (trimPrefix "      " (trimPrefix "\n" $formattedPrometheusServiceMonitorSelectorObject)) -}}
{{- else }}
  {{- $data = $data | replace "$CR_PROMETHEUS_SERVICE_MONITOR_SELECTOR_OBJECT: REMOVE_ME" "{}" -}}
{{- end }}

{{- $prometheusPodMonitorSelectorMap := dict -}}
{{- if .Values.prometheus }}
  {{- if .Values.prometheus.prometheusSpec }}
    {{- if .Values.prometheus.prometheusSpec.podMonitorSelector }}
      {{- $prometheusPodMonitorSelectorMap = .Values.prometheus.prometheusSpec.podMonitorSelector -}}
    {{- end }}
  {{- end }}
{{- end }}
{{- if $prometheusPodMonitorSelectorMap }}
  {{- $formattedPrometheusPodMonitorSelectorObject := toYaml $prometheusPodMonitorSelectorMap | nindent 6 -}}
  {{- $data = $data | replace "$CR_PROMETHEUS_POD_MONITOR_SELECTOR_OBJECT: REMOVE_ME" (trimPrefix "      " (trimPrefix "\n" $formattedPrometheusPodMonitorSelectorObject)) -}}
{{- else }}
  {{- $data = $data | replace "$CR_PROMETHEUS_POD_MONITOR_SELECTOR_OBJECT: REMOVE_ME" "{}" -}}
{{- end }}

# Inject the externalLabels as a pre-formatted YAML block to allow users to define multiple labels in a dict
{{- $prometheusExternalLabelsMap := dict -}}
{{- if .Values.prometheus -}}
  {{- if .Values.prometheus.prometheusSpec -}}
    {{- $prometheusExternalLabelsMap = .Values.prometheus.prometheusSpec.externalLabels -}}
  {{- end -}}
{{- end -}}
{{- if $prometheusExternalLabelsMap }}
  {{- $formattedExternalLabels := toYaml $prometheusExternalLabelsMap | nindent 6 -}}
  {{- $data = $data | replace "$PROMETHEUS_EXTERNAL_LABELS: REMOVE_ME" $formattedExternalLabels -}}
{{- else }}
  {{- $data = $data | replace "$PROMETHEUS_EXTERNAL_LABELS: REMOVE_ME" "{}" -}}
{{- end }}

# Inject remoteWrite
{{- $prometheusRemoteWriteList := dict -}}
{{- if .Values.prometheus }}
  {{- if .Values.prometheus.prometheusSpec }}
    {{- if .Values.prometheus.prometheusSpec.remoteWrite }}
      {{- $prometheusRemoteWriteList = .Values.prometheus.prometheusSpec.remoteWrite -}}
    {{- end }}
  {{- end }}
{{- end }}
{{- if $prometheusRemoteWriteList }}
  {{- $formattedRemoteWriteObject := toYaml $prometheusRemoteWriteList | nindent 4 -}}
  {{- $data = $data | replace "- url: ${CR_PROMETHEUS_REMOTE_WRITE_OBJECT}" $formattedRemoteWriteObject -}}
{{- else }}
  {{- $data = $data | replace "  remoteWrite:\n    - url: ${CR_PROMETHEUS_REMOTE_WRITE_OBJECT}" "" -}}
{{- end }}


# Inject containers
{{- $prometheusContainersList := dict -}}
{{- if .Values.prometheus }}
  {{- if .Values.prometheus.prometheusSpec }}
    {{- if .Values.prometheus.prometheusSpec.containers }}
      {{- $prometheusContainersList = .Values.prometheus.prometheusSpec.containers -}}
    {{- end }}
  {{- end }}
{{- end }}
{{- if $prometheusContainersList }}
  {{- $formattedContainersObject := toYaml $prometheusContainersList | nindent 4 -}}
  {{- $data = $data | replace "- name: ${CR_PROMETHEUS_CONTAINERS_OBJECT}" $formattedContainersObject -}}
{{- else }}
  {{- $data = $data | replace "\n    - name: ${CR_PROMETHEUS_CONTAINERS_OBJECT}" "" -}}
{{- end }}

# Inject volumes
{{- $prometheusVolumesList := dict -}}
{{- if .Values.prometheus }}
  {{- if .Values.prometheus.prometheusSpec }}
    {{- if .Values.prometheus.prometheusSpec.volumes }}
      {{- $prometheusVolumesList = .Values.prometheus.prometheusSpec.volumes -}}
    {{- end }}
  {{- end }}
{{- end }}

# Inject volumeMounts
{{- $prometheusVolumeMountsList := dict -}}
{{- if .Values.prometheus }}
  {{- if .Values.prometheus.prometheusSpec }}
    {{- if .Values.prometheus.prometheusSpec.volumeMounts }}
      {{- $prometheusVolumeMountsList = .Values.prometheus.prometheusSpec.volumeMounts -}}
    {{- end }}
  {{- end }}
{{- end }}
{{- if $prometheusVolumeMountsList }}
  {{- $formattedVolumeMountsObject := toYaml $prometheusVolumeMountsList | nindent 4 -}}
  {{- $data = $data | replace "- name: ${CR_PROMETHEUS_VOLUME_MOUNTS_OBJECT}" $formattedVolumeMountsObject -}}
{{- else }}
  {{- $data = $data | replace "  volumeMounts:\n    - name: ${CR_PROMETHEUS_VOLUME_MOUNTS_OBJECT}" "" -}}
{{- end }}
{{- if $prometheusVolumesList }}
  {{- $formattedVolumesObject := toYaml $prometheusVolumesList | nindent 4 -}}
  {{- $data = $data | replace "- name: ${CR_PROMETHEUS_VOLUMES_OBJECT}" $formattedVolumesObject -}}
{{- else }}
  {{- $data = $data | replace "  volumes:\n    - name: ${CR_PROMETHEUS_VOLUMES_OBJECT}" "" -}}
{{- end }}


# Inject Service Account Annotations
{{- $prometheusSAAnnotationsMap := dict -}}
{{- if .Values.prometheus }}
  {{- if .Values.prometheus.serviceAccount }}
    {{- if .Values.prometheus.serviceAccount.annotations }}
      {{- $prometheusSAAnnotationsMap = .Values.prometheus.serviceAccount.annotations -}}
    {{- end }}
  {{- end }}
{{- end }}
{{- if $prometheusSAAnnotationsMap }}
  {{- $formattedSAAnnotationsObject := toYaml $prometheusSAAnnotationsMap | indent 4 -}}
  {{- $data = $data | replace "    ${CR_PROMETHEUS_SA_ANNOTATIONS}: \"\"" $formattedSAAnnotationsObject -}}
{{- else }}
  {{- $data = $data | replace "  annotations:\n    ${CR_PROMETHEUS_SA_ANNOTATIONS}: \"\"\n" "" -}}
{{- end }}

{{- /* Filter out prometheus-node-exporter resources if disabled */ -}}
{{- $nodeExporterEnabled := true }}
{{- if .Values.nodeExporter }}
  {{- if hasKey .Values.nodeExporter "enabled" }}
    {{- $nodeExporterEnabled = .Values.nodeExporter.enabled }}
  {{- end }}
{{- end }}
{{- $parts := splitList "\n---\n# Source: " (printf "\n%s" $data) -}}
{{- $newData := "" -}}
{{- range $part := $parts -}}
{{- if (trim $part) }}
{{- if not (and (not $nodeExporterEnabled) (contains "app.kubernetes.io/name: prometheus-node-exporter" $part)) }}
{{- $newData = printf "%s\n---\n# Source: %s" $newData $part -}}
{{- end }}
{{- end }}
{{- end }}
{{- $data = trimPrefix "\n" $newData -}}
{{ $data }}
