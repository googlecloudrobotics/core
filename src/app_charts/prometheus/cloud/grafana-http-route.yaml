apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  hostnames:
  - {{ .Values.domain }}
  parentRefs:
  - name: crc-gateway
    namespace: default
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /grafana/
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: prom-grafana
      port: 80
  - matches:
    - path:
        type: Exact
        value: /grafana
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /
    backendRefs:
    - name: prom-grafana
      port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: grafana-auth
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: grafana
  extAuth:
    {{- if .Values.gf_auth_backend.contextExtensions }}
    contextExtensions:
    {{- range $k, $v := .Values.gf_auth_backend.contextExtensions }}
    - name: {{ $k }}
      value: {{ $v | quote }}
    {{- end }}
    {{- end }}
    headersToExtAuth:
    - authorization
    - cookie
    - x-forwarded-access-token
    - x-forwarded-host
    - apikey-token
    - x-server-name
    {{- if eq (default "http" .Values.gf_auth_backend.protocol) "grpc" }}
    grpc:
      backendRefs:
      - name: {{ .Values.gf_auth_backend.service }}
        {{- if .Values.gf_auth_backend.namespace }}
        namespace: {{ .Values.gf_auth_backend.namespace }}
        {{- end }}
        port: {{ .Values.gf_auth_backend.port }}
    {{- else }}
    http:
      path: {{ .Values.gf_auth_backend.path }}
      backendRefs:
      - name: {{ .Values.gf_auth_backend.service }}
        {{- if .Values.gf_auth_backend.namespace }}
        namespace: {{ .Values.gf_auth_backend.namespace }}
        {{- end }}
        port: {{ .Values.gf_auth_backend.port }}
    {{- end }}
{{- if and .Values.gf_auth_backend.namespace (ne .Values.gf_auth_backend.namespace .Release.Namespace) }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-grafana-auth-{{ .Values.gf_auth_backend.service }}
  namespace: {{ .Values.gf_auth_backend.namespace }}
spec:
  from:
  - group: gateway.envoyproxy.io
    kind: SecurityPolicy
    namespace: {{ .Release.Namespace }}
  to:
  - group: ""
    kind: Service
    name: {{ .Values.gf_auth_backend.service }}
{{- end }}


