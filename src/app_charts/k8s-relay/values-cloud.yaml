# MetricRelabelConfigs to apply to samples after scraping, but before ingestion.
prometheus:
  serviceMonitor:
    metricRelabelings:  []

kubernetes_relay_server:
  resources:
    requests:
      memory: "16Mi"
      cpu: "100m"

authProxy:
  authHeaders:
  - authorization
  - cookie
  - x-forwarded-access-token
  - x-forwarded-host
  - apikey-token
  - x-server-name
