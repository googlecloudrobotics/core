apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubernetes-relay-client
spec:
  hostnames:
  - {{ .Values.domain }}
  parentRefs:
  - name: crc-gateway
    namespace: default
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /apis/core.kubernetes-relay/client
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /client
    timeouts:
      request: 3600s
      backendRequest: 3600s
    backendRefs:
    - name: kubernetes-relay-server
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubernetes-relay-server
spec:
  hostnames:
  - {{ .Values.domain }}
  parentRefs:
  - name: crc-gateway
    namespace: default
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /apis/core.kubernetes-relay/server
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /server
    backendRefs:
    - name: kubernetes-relay-server
      port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: kubernetes-relay-client-auth
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: kubernetes-relay-client
  extAuth:
    contextExtensions:
    - name: robot
      value: "false"
    headersToExtAuth:
    {{- toYaml .Values.authProxy.authHeaders | nindent 4 }}
    failOpen: false
    grpc:
      backendRefs:
      - name: token-vendor
        namespace: app-token-vendor
        port: 9091
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: kubernetes-relay-server-auth
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: kubernetes-relay-server
  extAuth:
    contextExtensions:
    - name: robot
      value: "true"
    headersToExtAuth:
    {{- toYaml .Values.authProxy.authHeaders | nindent 4 }}
    failOpen: false
    grpc:
      backendRefs:
      - name: token-vendor
        namespace: app-token-vendor
        port: 9091
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: kubernetes-relay-client-extension-policy
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kubernetes-relay-client
  lua:
    - type: Inline
      inline: |
        function envoy_on_request(request_handle)
          local path = request_handle:headers():get(":path")
          if path then
            local server = path:match("^/apis/core.kubernetes-relay/client/([^/?#]+)")
            if server then
              request_handle:headers():replace("X-Server-Name", server)
            else
              request_handle:headers():remove("X-Server-Name")
            end
          end
        end
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: kubernetes-relay-client-backend-policy
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kubernetes-relay-client
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: Headers
      headers:
        - name: X-Server-Name
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: kubernetes-relay-server-backend-policy
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kubernetes-relay-server
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: QueryParams
      queryParams:
        - name: server
